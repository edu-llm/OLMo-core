# Split arm: fact tokens are NOT supervised (their loss is masked out).
#
# This file and split.yaml differ on exactly one line — `arm`. Keep it that way. Every
# training hyperparameter lives under `shared:` and must be byte-identical in both
# files; eval/compare_arms.py reads the fingerprint each run writes and refuses to
# compare two runs that disagree on any of them.
#
#   diff configs/dense.yaml configs/split.yaml
#
# should show one hunk.

arm: split

shared:
  # --- controls: identical across arms -------------------------------------
  seed: 42

  # Must equal the value passed to scripts/tokenize_corpus.py, which refuses to start
  # if they disagree. 16,384 keeps 98.0% of documents whole (the corpus max is 117,191
  # tokens; 32,768 would keep 99.7% but doubles microbatch memory for 1.7 points).
  sequence_length: 16384

  # Sequences are PACKED, so one sequence holds many documents and the split arm finds
  # several fact blocks in it. 16 x 16,384 = 262,144 tokens/step, which over ~615M
  # real tokens at 13 epochs is ~30,500 steps.
  global_batch_size_sequences: 16
  # One 16,384-token sequence per rank per microbatch. The `default` LM loss
  # materializes the full logits tensor (nn/lm_head.py:252), which at vocab 151,936 is
  # 10.0 GB fp32 plus 10.0 GB of gradient, so ~28 GB with weights and Adam state. That
  # fits an 80 GB H100 with room and does NOT fit a 24 GB A10G — this config is for the
  # H100 shape. Raising it to 2 costs ~48 GB and still fits; liger-kernel's
  # loss_implementation="fused_linear" skips the logits tensor and lifts the ceiling.
  rank_microbatch_size_sequences: 1

  # Leave max_steps null to derive it from the corpus size and `epochs`, which keeps
  # total input tokens tied to the data rather than to a number typed here.
  max_steps: null
  # 13 epochs over the 627M-token corpus is 8.15B tokens seen. Chosen for fact
  # exposure, not for token count: at 3 epochs only 5% of facts are cited often
  # enough to reach 80 exposures, at 13 it is 19%, and 87% of all premise uses land
  # on a fact the dense arm has seen 80+ times. The remaining tail is cited once or
  # twice and no epoch count reaches it — that is the regime the fact block serves.
  epochs: 13

  # 2e-5, not 1e-5. The batch went from 65,536 to 262,144 tokens/step and
  # Adam conventionally scales with the square root of batch size, so 4x batch
  # wants ~2x LR. Linear scaling would say 4e-5; sqrt is the conservative
  # choice for a 0.5B model continuing from pretrained weights.
  learning_rate: 2.0e-5
  # ~8% of the run. Scales with `epochs`: at 3 epochs the corpus gave ~640 steps and
  # this was 50. Re-derive it if `epochs` or the corpus size changes materially —
  # train.py warns when warmup exceeds 10% of the derived step count.
  warmup_steps: 2400
  lr_alpha_f: 0.1          # cosine decays to 10% of peak
  weight_decay: 0.0        # off: SFT on 0.5B for a few epochs, and it would interact
                           #      with the tied embedding
  betas: [0.9, 0.95]
  eps: 1.0e-8
  max_grad_norm: 1.0

  # True gives the real 494M Qwen2.5-0.5B. Single-GPU only — see INCOMPATIBILITIES.md §3.
  tie_embeddings: true

  compile_model: false     # keep off until src/test/nn/transformer/qwen_test.py passes compiled
  num_workers: 2

  # --- logging / checkpointing ---------------------------------------------
  run_name: qwen25-0.5b-metamath
  wandb_project: null      # set to a project name to enable W&B
  log_every: 10
  save_every: 500
  save_overwrite: false
