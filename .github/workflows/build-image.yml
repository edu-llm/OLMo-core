# Build-caller. Registration REFUSES without this file.
#
# tools/verify_registered_dockerfiles.py checks five claims about this repository
# before writing a registration, and one of them is that some workflow on the
# default branch references
#
#     edu-llm/platform/.github/workflows/build-research-image.yml
#
# The publisher role's trust policy pins `job_workflow_ref` to exactly that path,
# so no other route to a credential exists and no image can ever be published
# without it. Its absence is finding `no_workflow_calls_the_platform_build`, which
# exits 1 -- a RegistrationRefused, not an unreadable-repo error.
#
# `AWS_ECR_PUBLISHER_ROLE_ARN` must be set BY HAND as a repository variable; there
# is no organization-level default:
#
#     gh variable set AWS_ECR_PUBLISHER_ROLE_ARN --repo edu-llm/memsplit-hop --body <arn>
#
# Missing it yields `publisher_role_arn_is_empty` at build time rather than here.
name: Build research image

on:
  push:
    # Only edullm/** branches publish. The platform's build gates on a branch-scoped
    # `sub` condition, so a push elsewhere cannot mint a credential anyway.
    branches:
      - "edullm/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: edu-llm/platform/.github/workflows/build-research-image.yml@main
    with:
      repository: memsplit-hop
      publisher_role_arn: ${{ vars.AWS_ECR_PUBLISHER_ROLE_ARN }}
      aws_region: us-east-1
      # Runs in the built image, so it proves the image can actually import and
      # execute the package rather than only that it assembled. The byte-level
      # fallback tokenizer keeps this independent of a tiktoken download.
      test_command: MEMSPLIT_TOKENIZER=byte python -m pytest tests/ -q
