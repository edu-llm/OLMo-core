# SMOKE, arm M/W: 370M-active MoE, standard Muon with decoupled weight decay (control)
#
#   edullm check --json --spec .edullm/run-smoke-moe-muonw.yaml --experiment muonh-smoke \
#     --dataset olmo-150b-dolma2-v1 --team scratch --compute gpu-1xl40s --hours 1 --attempts 1
#   edullm submit <same flags>
#
# PURPOSE IS MEASUREMENT, NOT A RESULT. 120 steps says nothing about which optimizer is better --
# the paper's own finding is that Hyperball trails early and overtakes as the LR decays, so a
# truncated run is biased toward the weight-decay arm. What this proves is that the arm trains on
# real data under FSDP without diverging, and what it MEASURES is tokens/s, which is what sizes
# the real runs against the 24 h attempt bound. See .edullm/muon-hyperball.md.
#
# --hours AND --attempts ARE NOT OPTIONAL. The workload profile's defaults are its maximums
# (24 h x 2), which price high enough to park the run waiting for an approver rather than start
# it. Read the actual figure from `check --json`, never from a file.
#
# --init-method fan_in ON EVERY ARM, including the weight-decay ones. Hyperball's radius is
# measured from W_0, so the initializer sets the absolute step length; fan_in is the paper's
# std=1/sqrt(d_in). An arm on a different initializer is not a control.
#
# --param-dtype bfloat16 is written into the command text on purpose: the platform's precision
# guard reads command words and cannot see a dtype set in code, so naming it turns a T4
# submission into a free refusal instead of a billed machine that dies on its first kernel.
#
# --learning-rate 0.02 is a MuonW rate: it is scaled per matrix by adjust_lr
# (Moonlight's 0.2*sqrt(max(d_in,d_out))), so the effective step is much larger than the
# number here. It is a starting point for the sweep, not a tuned value.
#
# TRITON_F32_DEFAULT=ieee IS A CORRECTNESS SETTING, NOT A PERFORMANCE ONE, AND IT IS EXPORTED
# BEFORE PYTHON STARTS BECAUSE IT PARTICIPATES IN KERNEL CODEGEN. Triton lowers tl.dot to TF32
# on Ampere+ by its own default, and torch.backends.cuda.matmul.allow_tf32 does NOT reach it --
# so a job can truthfully report "tf32 disabled" for torch and still run every Triton kernel at
# reduced precision. Measured elsewhere in this project: 1.145e-03 relative error unset against
# 6.892e-06 with ieee, 166x from one environment variable. The MoE dispatch path here is Triton
# (binned_gather), so without this the two MoE arms would differ from the two dense arms in
# numerics as well as architecture, and the setting is applied to all four arms so that they do
# not differ from each other either.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-1xl40s
command: >-
  bash -lc 'export TRITON_F32_DEFAULT=ieee
  && python -m torch.distributed.run --nproc-per-node=1 --standalone
  .edullm/train_on_corpus.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --model-factory olmo2_370M_moe --init-method fan_in
  --optimizer muon_w --learning-rate 0.02 --adamw-learning-rate 8.2e-4
  --param-dtype bfloat16
  --sequence-length 2048 --steps 120 --warmup-steps 20
  --global-batch-size 262144 --rank-microbatch-size 8192
  --save-interval 100 --data-seed 0 --work-dir /tmp/dataset-cache
  trainer.callbacks.checkpointer.max_checkpoints=null'
