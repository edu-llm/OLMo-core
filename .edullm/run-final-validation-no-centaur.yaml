# Stock OLMo2-370M / ~10B RegMix validation with the no-centaur probe winner vector.
# Global batch matches the completed no-proxy validation run: 256 Ki tokens/step.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'export PYTHONDONTWRITEBYTECODE=1 EDULLM_LAUNCH_CHECK=waived
  EDULLM_WANDB_PROJECT=hpo-final-validation WANDB_PROJECT=hpo-final-validation
  WANDB_RUN_GROUP=hpo-final-validation-370m-10b PARAM_DTYPE=bfloat16
  EDULLM_CHECKPOINT_DIR="$EDULLM_CHECKPOINT_DIR" &&
  python .edullm/final_validation.py --vector no-centaur-winner
  --global-batch-tokens 262144'
