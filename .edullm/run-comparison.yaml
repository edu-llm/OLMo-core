# Eight-arm mixer comparison. Submit as one 24-cell fan-out:
#   edullm submit --experiment mamba-comparison --dataset reservoir-dolma2-v1 \
#     --team memory-split \
#     --spec .edullm/run-comparison.yaml --fanout-size 24 \
#     --fanout-index-parameter AWS_BATCH_JOB_ARRAY_INDEX --attempts 1
#
# Three replicates per arm, using the first three of the five seeds the ledger in
# `model_arch_tests.py` admits. The remaining two stay valid, so a later wave can add
# depth without reissuing seeds.
#
# The arrays are deliberately arm-major. If a platform limit truncates the fan-out,
# whole arms are lost while completed arms retain all three replicates.
#
# EVERY ARM AFTER THE FOURTH IS APPENDED, NEVER INSERTED. Indices 0-11 are byte for byte the
# four-arm wave they always were and 12-14 the fifth arm, so `--fanout-size 12` still runs
# exactly the original study, `15` the five-arm one, and `24` the extended one. The control is
# still the first arm.
#
# xLSTM ALONE TAKES A LARGER RANK MICROBATCH, AND IT IS NOT A TUNING CHOICE. Its two sLSTM
# layers run FlashRNN's fused kernel, which pads any batch that is not a multiple of eight with
# `torch.ones` and then returns the recurrent-weight and bias gradients accumulated over the
# padded batch without slicing them back. At 8,192 tokens over sequence length 4,096 the batch
# is two, six of the eight streams are fabricated, and all three cells of this arm died with a
# non-finite loss at step 2. 32,768 tokens is eight sequences, so nothing is padded.
#
# The global batch is unchanged at 524,288 tokens, so the optimizer sees exactly the same steps;
# only the accumulation split differs, and with it this arm's memory and wall clock. Its
# throughput is therefore not measured against the other seven on equal footing, which is a
# smaller price than the seven cells this defect has already cost. `_slstm_prewarm_contract`
# refuses a batch that would be padded, so a return to 8,192 here fails at preflight.
#
# The decode probe is ON: `--no-decode-probe` is deliberately not passed. Decode latency and
# recurrent-state bytes are the serving-side cost, which training throughput does not predict --
# a mixer's state is fixed per sequence where attention's KV cache grows with context. It costs
# 216 single-token passes on rank zero after training, outside the steady-state window, and
# `decode_probe` records every failure as a reason rather than raising. The Householder arm has
# no fused recurrent kernel in `fla`, so its three cells record a stated absence there; that is
# the honest result and not a gap to be filled with another arm's number.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'export TRITON_F32_DEFAULT=ieee PYTHONDONTWRITEBYTECODE=1 &&
  I=${AWS_BATCH_JOB_ARRAY_INDEX:-0} &&
  ARMS=(mamba-b3 mamba-b3 mamba-b3
  xlstm xlstm xlstm
  mamba3-siso-pd mamba3-siso-pd mamba3-siso-pd
  native-pd native-pd native-pd
  gdn gdn gdn
  kda kda kda
  kda-hh-r2 kda-hh-r2 kda-hh-r2
  kda-gconv kda-gconv kda-gconv) &&
  DSEEDS=(210007 220014 230021
  210007 220014 230021
  210007 220014 230021
  210007 220014 230021
  210007 220014 230021
  210007 220014 230021
  210007 220014 230021
  210007 220014 230021) &&
  ISEEDS=(110007 120014 130021
  113008 123015 133022
  116009 126016 136023
  119010 129017 139024
  122011 132018 142025
  125012 135019 145026
  128013 138020 148027
  131014 141021 151028) &&
  MICRO=(8192 8192 8192
  32768 32768 32768
  8192 8192 8192
  8192 8192 8192
  8192 8192 8192
  8192 8192 8192
  8192 8192 8192
  8192 8192 8192) &&
  python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/train_core6_arm.py "$EDULLM_RUN_ID"
  --arm "${ARMS[$I]}" --data-seed "${DSEEDS[$I]}" --init-seed "${ISEEDS[$I]}"
  --sequence-length 4096 --steps 1144 --warmup-steps 114 --learning-rate 3e-4
  --global-batch-size 524288 --rank-microbatch-size "${MICRO[$I]}" --save-interval 572
  --save-folder "$EDULLM_CHECKPOINT_DIR" --param-dtype bfloat16'
