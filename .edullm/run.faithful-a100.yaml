# STAGE 2 ON gpu-8xa100, ARM 2 OF 3: five seeds of the faithful hyper-connection.
#
#   edullm check  --json --experiment hyper-connections-370m --dataset regmix-10b-v1 \
#     --team input-core --spec .edullm/run.faithful-a100.yaml --compute gpu-8xa100 \
#     --hours 6 --attempts 2 --fanout-size 5 --fanout-index-parameter seed
#
# --hours 6, AND THE LINE ABOVE SAID 4 UNTIL 2026-08-10 WHILE THE RUN IT DESCRIBES WENT OUT AT
# 6. Four hours is the baseline's bound. This arm computes hyper-connection lanes, runs at
# 3.027-3.083 s/step against the baseline's 1.700, and needs 5.17 hours for 6,000 steps. The
# first submission of this stage, `run_019fe7bc-49d0`, died complete at the four-hour wall:
# five of five cells, steps 4,640 to 4,699, each at a runtime of 3.99 hours, and a timeout is
# measured to forfeit its second attempt on this workload. `run_019fe90b-f99e` is the
# resubmission and it went out at six, where it has 14% spare and reported five of five.
#
# COPYING A SUBMIT LINE OUT OF A HEADER IS HOW FIFTEEN CELLS DIED, so this one is now the text
# of what was actually submitted rather than of what was once planned, and
# `hyper_connection_arms.A100_STAGE_HOURS_BY_ARM` is the machine-readable copy that
# `test_train_hyper_connections.py` checks this line against. There is deliberately no single
# `--hours` constant left to copy: the bound is per arm, because the arms have different step
# times and pretending otherwise is what killed the stage.
#
# --optimizer skip_step_adamw IS THE AMENDMENT OF 2026-08-08 and is identical on all five arms.
# `run.baseline-a100.yaml` carries the full argument: two of the five baseline cells spiked in
# a way that supplied 99% of the endpoint variance. The optimizer line is the intervention and
# it is the same on every arm because an optimizer that differed between them would confound
# the contrast far worse than the noise it removes.
#
# The L40S spec this is derived from is `run.faithful-stage.yaml` and it is not edited:
# `run_019fe2c2-afa8` was admitted from it. See `run.baseline-a100.yaml` for why the shape
# moved, which two words differ from the L40S command, and why nothing else may.
#
# --fail-closed-by-step 400 IS HERE AND IS REACHABLE. `train` attaches the lane monitor only
# to an arm that has lanes, so this is the one option that separates a treatment stage from
# the baseline stage other than --arm itself. An arm whose lanes never differentiate is the
# baseline with dead parameters and no downstream number from it reads in either direction, so
# finding out at step 400 costs about twenty minutes on this shape rather than the arm.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/train_hyper_connections.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --arm faithful
  --model-factory hc_370M
  --sequence-length 4096
  --global-batch-size 786432
  --rank-microbatch-size 12288
  --steps 6000
  --save-interval 500
  --warmup-steps 120
  --learning-rate 7.8e-4
  --weight-decay 0.033
  --z-loss-multiplier 1e-5
  --held-out-shards 2
  --bytes-per-token 4.57
  --monitor-interval 50
  --eval-interval 500
  --fail-closed-by-step 400
  --optimizer skip_step_adamw
  --skip-step-sigma-factor 6
  --skip-step-rolling-interval 128
  --param-dtype bfloat16'
