# WHAT THIS COMMIT RUNS: a 100-step throughput probe on gpu-8xa100, and nothing else. It is
# not an arm, it trains nothing anybody will read, and it exists to answer one question that
# gates roughly $4,000 of the nine-run tranche.
#
#   edullm submit --experiment hyper-connections-370m --dataset regmix-10b-v1 \
#     --team input-core --hours 3 --compute gpu-8xa100
#
# THE TRANCHE CONFIG THIS REPLACED IS NOT LOST. The 6,000-step L40S baseline that was here is
# the whole of `.edullm/run.yaml` at commit d63dbb592, and one command puts it back:
#
#   git show d63dbb592:.edullm/run.yaml > .edullm/run.yaml
#
# It is also reproduced verbatim at the bottom of this file, under RECOVERING THE L40S
# TRANCHE, so that a reader who has this file and no history can still see it. If the probe
# says A100 is not better, restore it, commit, and the tranche is exactly where it was.
#
# ---------------------------------------------------------------------------------------
# WHY A100 IS WORTH 100 STEPS OF SOMEBODY'S MONEY
# ---------------------------------------------------------------------------------------
#
# The 370M arms are bound by the wire and not by the card. gpu-4xl40s is a g6e box with no
# NVLink and no GPU peer-to-peer, so every FSDP collective stages over PCIe at about
# 4.4 GB/s, and the measured clean median there is 10.32 s/step. A 12,715-step arm -- the
# 10B-token horizon the pre-registration is written against -- is 36.4 hours at that rate,
# against a 24-hour per-attempt ceiling `--hours` can only lower. That is why the committed
# tranche is 6,000 steps and 4.72B tokens: not money, reach.
#
# gpu-8xa100 is a p4d.24xlarge and has NVLink. If the wire stops binding, the step becomes
# compute-bound, and the two shapes are 2,496 TF against 1,448 TF. That is 1.72x of compute
# against the 1.79x of step time a full arm needs, so the answer is genuinely close and is
# not worth arguing about further -- it is worth measuring for a few dollars.
#
# THE NUMBER THIS PROBE IS READ AGAINST, DECIDED HERE, BEFORE IT RUNS. Fixed overhead for a
# 12,715-step arm at the tranche's own intervals is 27 held-out evaluations at 104 s, 26
# checkpoints at 46 s, 254 lane-monitor firings at 1.37 s and 118 s of start-up: 4,470 s, or
# 1.24 hours. What is left for the steps themselves is:
#
#   <= 6.44 s/step   fits 24 hours exactly, with no margin at all. Not a decision to make.
#   <= 5.76 s/step   fits 24 hours with 10% spare. THIS IS THE THRESHOLD. At or under it,
#                    move the tranche to A100 at the full 12,715 steps and 10B tokens. It is
#                    `A100_STEP_SECONDS_FOR_FULL_HORIZON` in hyper_connection_arms.py, and a
#                    test pins it so that it cannot be quietly moved to meet a result.
#   <= 5.00 s/step   fits the 21-hour submission the $4,000 ceiling actually allows, with
#                    10% spare. Under this, the horizon is bought without also having to
#                    re-price the tranche against a 24-hour ceiling.
#
# Above 5.76 s/step, restore the L40S tranche and run 6,000 steps as planned. Between 5.00
# and 5.76 the horizon fits the workload bound but the budget has to be re-read out of
# `edullm check --json` at `--hours 24`, because the ceiling it prices is attempts x the
# runtime bound x the rate x the cell count and 24 is over $4,000 at the L40S rate.
#
# HOW TO READ THE STEP TIME OFF THIS RUN, AND THE MISTAKE THAT MUST NOT HAPPEN AGAIN.
# THE LANE MONITOR COSTS ABOUT 1.37 s ON EVERY STEP IT FIRES ON. The first 370M probe was
# priced at 11.69 s/step, which was wrong, and it was wrong because the rows read were the
# five carrying `hc/*` keys -- which are exactly the monitor's firing steps. That number was
# the cost of the instrument, sampled five times, and not the cost of a step. It sent a whole
# tranche to be re-planned against a horizon it did not need.
#
# So: `--monitor-interval 50` and `--eval-interval 50` fire on the same steps here, 50 and
# 100, deliberately. Take the median of the steps that are neither -- 2 through 49 and 51
# through 99, which is 97 of them -- and drop step 1, which pays for torch.compile. Any
# median that includes step 50 or step 100 is measuring an instrument.
#
# ---------------------------------------------------------------------------------------
# WHY --rank-microbatch-size IS 12288, WHICH IS NOT THE 16384 THAT WAS SAFE ON L40S
# ---------------------------------------------------------------------------------------
#
# 786,432 tokens over 8 ranks is 98,304 per rank. Three values divide it exactly: 24,576 (4
# microbatches), 16,384 (6) and 12,288 (8). Bigger is better for this probe -- fewer
# gradient-accumulation microbatches is fewer crossings of the interconnect, which is the
# variable under test -- so the question is only how big will fit, and an A100-40GB has 40 GB
# where the L40S has 48. There is no activation checkpointing configured anywhere in
# train_on_corpus.py, so nothing absorbs the difference.
#
# THE LM HEAD DOMINATES, AND THE LOGITS TENSOR IS TOUCHED FIVE TIMES OVER, NOT ONCE. The
# default loss implementation materializes the whole thing: `LMHead.forward` computes bf16
# logits of (microbatch x 100,352), and `nn/functional/cross_entropy_loss.py` opens with
# `logits = logits.float()` and then runs both `F.cross_entropy` and, because this tranche
# sets `--z-loss-multiplier`, `logits.logsumexp(-1)`. So in units of the bf16 tensor:
#
#   bf16 logits out of w_out                                       1x
#   fp32 upcast, saved for backward by cross_entropy AND logsumexp 2x
#   log_softmax result, saved by F.cross_entropy for its backward  2x
#                                                                  ---
#   forward peak                                                   5x
#   backward: grad wrt the fp32 logits arrives while both saved
#   fp32 tensors are still live, and the bf16 tensor has been freed 6x
#
# At 12,288 the bf16 tensor is 12,288 x 100,352 x 2 = 2.30 GiB, so the head peaks at 13.8 GiB.
# The rest of the model, for the `faithful` arm at n_lanes 4, saves roughly 32K elements per
# token per layer -- 4x d_model in and out of each block because the residual stream carries
# four lanes, plus qkv, the qk-norms, the attention output and 4x the 4,096-wide MLP -- which
# is 1.0 MiB per token over 16 layers, or 12.0 GiB. Sharded state over 8 ranks is small: fp32
# master weights, two AdamW moments and the fp32 gradient shard are 0.22 GiB each, and the LM
# head is fully_shard'd with reshard_after_forward=False so its 0.19 GiB of unsharded bf16
# weights stay resident. Add roughly 1.8 GiB for the CUDA context, NCCL buffers and inductor
# workspace.
#
#   rank microbatch    LM head peak    other activations    total      of a 40 GB card
#   12,288 (8 micro)      13.8 GiB           12.0 GiB      ~28.9 GiB    73%   <- chosen
#   16,384 (6 micro)      18.4 GiB           16.0 GiB      ~35.7 GiB    90%
#   24,576 (4 micro)      27.6 GiB           24.0 GiB      ~54.7 GiB    over
#
# 16,384 IS THE ONE THAT LOOKS FINE AND IS NOT. The same arithmetic puts it at ~38.8 GiB on
# the L40S, where it ran -- a 48 GB card had 5.7 GiB of slack and used some of it. Move that
# to a 40 GB card and the slack is what disappears; 90% of a card before fragmentation is not
# a margin, it is a coin flip. And it is the expensive coin flip: `RETRY_ONLY_WHAT_A_RETRY_
# FIXES` in the platform's execution.py reads `OnReason "OutOfMemoryError*" EXIT`, so an OOM
# is not retried. It costs the queue wait, the machine, and the day this probe is meant to
# save. 12,288 leaves 10.6 GiB spare, which is 27%.
#
# The cost of choosing 12,288 over 16,384 is 8 microbatches per rank instead of 6, so 33%
# more collectives. On PCIe that would be the whole result; on NVLink it is what the probe is
# measuring the absence of, and 8 crossings of a 2,845 MB payload is 22.8 GB per rank per
# step against the 34.1 GB the L40S arm moves at 12 crossings. If A100 cannot beat 5.80 s/step
# while moving a third less traffic over a link two orders of magnitude faster, it will not
# beat it at 6 microbatches either.
#
# ---------------------------------------------------------------------------------------
# WHY --nproc-per-node=8, AND WHAT ACTUALLY READS IT
# ---------------------------------------------------------------------------------------
#
# `edullm check` refused the 4-process command against this shape with `process_per_device`.
# The rule is in the platform's launchers.py: `require_a_process_for_every_device` looks up
# CONTAINER_SHAPES[compute_profile].gpus -- gpu-8xa100 is 8 -- and compares it against
# `read_launch_plan(command).processes`. That plan is built by opening the `bash -lc` wrapper
# with shlex, finding `python` in command position, reading `-m torch.distributed.run` as the
# launcher, and then scanning every remaining word for `--nproc-per-node` or `--nproc_per_node`
# in either the `=value` or the ` value` spelling. The count it reads has to equal 8 exactly:
# fewer idles cards that are billed, more puts two ranks on one device.
#
# Three things that would look like a fix and are not. The profile's *name* is never parsed,
# so `gpu-8xa100` reading like eight devices is not what satisfies this. An absent flag is
# read as 1, not as "unspecified", so naming a launcher without a count is the original defect
# with a launcher in front of it. And `auto`, `gpu`, `cpu` or a shell variable make the count
# unreadable, which is not refused -- that is a hole and using it would be a lie, not a fix.
# The eight below is a number, in a word the guard reads, and `test_the_committed_command_
# starts_one_process_per_device` in test_train_hyper_connections.py holds it against the
# suggested_compute in this file.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/train_hyper_connections.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --arm faithful
  --model-factory hc_370M
  --sequence-length 4096
  --global-batch-size 786432
  --rank-microbatch-size 12288
  --steps 100
  --save-interval 100
  --warmup-steps 20
  --monitor-interval 50
  --eval-interval 50
  --param-dtype bfloat16'

