# MoE checkpoint-transfer smoke v2 (Ben / Lin et al.).
# 4-of-40 MoE at smoke width, real math-frontload tokens, held-out CE retention.
# Branch: edullm/** only — never main. Cap submit with --hours 4 --attempts 1 (~$3.22).
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-1xl4
command: >-
  bash -lc 'python .edullm/ckpt_transfer_smoke.py
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --steps-pre 200 --steps-gap 200 --steps-sft 400
  --seq-len 256 --batch-size 4
  --train-batches 32 --sft-batches 16 --eval-batches 8
  --num-experts 40 --top-k 4 --d-model 512 --n-layers 8 --n-heads 8
  --param-dtype float32'
