schema_version: 1
workload_profile: olmo-core-check
suggested_compute: gpu-1xa10g
# ONE COMMAND PER REPOSITORY, SO THIS FILE IS EDITED PER SUBMISSION.
#
# Currently: score the confirmatory grid -- the count axis and the entropy sweep -- against the gate
# report that run_019fdf85 produced.
#
# SINGLE PROCESS, NOT A FAN-OUT, AND THAT IS THE POINT OF THE CHANGE. The six-way fan-out submitted as
# run_019fdeab sat 28 hours without its children starting, while the single-process gate job submitted
# four hours later started in 4 minutes and finished in 7. `--prefix` takes several roots, so one process
# covers all six submissions and needs no array at all.
#
# `--dtype float32` is named because the platform's precision guard reads the command's text and cannot
# see a dtype chosen in code. `--last-only` scores each cell's final checkpoint, which is where every
# endpoint number is read.
#
# `--json` prints every scored row to stdout, which is the only way to read the numbers without calling
# AWS: there is no `edullm` verb that fetches a run's output, but `edullm logs` relays what the program
# printed. The rows are printed just before the three upload lines, so a 50-line tail reaches them.
command: >-
  bash -lc 'B=s3://sbsandbox-intern-edullm-outputs/teams/memory-split/runs;
  G=$B/run_019fdf85-2644-702e-b1f2-c94186fc7c49/gates-mano.json;
  python src/scripts/train/factcrowd/score_run.py --prefix
  $B/run_019fcfc6-c6cd-70be-aec5-e3e10d9fc2c4/
  $B/run_019fcfc8-14dd-706c-a2fa-ab2492af0bbb/
  $B/run_019fcfc8-acca-70c6-9345-f3674a37f8b0/checkpoints/
  $B/run_019fd3c2-ebb6-7038-85b6-eb508275feb4/checkpoints/
  $B/run_019fd3c2-9cb5-70d1-8aa4-7412df51bc6c/checkpoints/
  $B/run_019fd3c1-1d5f-7071-9171-a0c93f7dd0cc/
  --out ${EDULLM_OUTPUT_PREFIX}confirmatory.csv --work-dir /tmp/s
  --device cuda --dtype float32 --batch-size 512 --last-only --gate-report $G --json'
