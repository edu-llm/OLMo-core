# Retrain all five arms on the REPAIRED dataset, then evaluate them, in one job.
#
# WHY THIS SUPERSEDES EVERYTHING BEFORE IT. The eval of run_019ff280 (see
# docs/latent-cot/eval-2026-08-12-run_019ff72e.md) found the dataset was solvable without any
# search: unreachable targets were given no in-edges, so "does `> T` appear in the edge list" was
# exactly the label and scored 1.000 at every depth, out-of-distribution depths included. That is
# why the no-CoT lower anchor came back at a perfect 1.000 while the explicit-CoT upper anchor sat
# at chance -- inverted anchors are what a shortcut looks like from outside. Every number from
# every previous run is therefore vacuous, and re-running the CODI arms on that data would have
# measured nothing. graph_gen.generate() now builds two equal-length layered chains per instance,
# one rooted at the source and one at an in-degree-zero decoy root, and the classes differ ONLY in
# which chain the target sits on. On the regenerated held-out split every surface rule tested is
# at chance (0.500-0.517, was 1.000), and test_no_surface_heuristic_separates_the_classes is the
# regression test.
#
# A PROPERTY WORTH KNOWING WHEN READING THE RESULTS: nothing in the construction except the choice
# of target consults `reachable`, so for a fixed seed both classes are the SAME GRAPH with a
# different node named as the sink. The positive and negative of each pair are matched exactly,
# which is a stronger confound control than the old construction had even in intent.
#
# --batch-size 8, NOT 16, AND THAT IS THE OOM FIX. run_019ff280 died at 2h48m with 38.51 GiB
# allocated on a 40 GiB A100, at rope.py:528 where q and k are upcast to fp32 inside the forward.
# Activations scale linearly with batch, so 8 should land near 20 GB. Two things make this
# comfortable rather than marginal: the repaired generator puts half the nodes on the decoy chain,
# so BFS frontiers from the source are narrower and sequences are shorter (the longest teacher
# trace fell from 103 tokens to 57), and only the three CODI arms hold a K=10 chain alive at all.
# The OOM took exactly A2/A3/A4 and left A0/A1 finishing all 2,000 steps, which is consistent.
#
# THE LR IS NOW LESS ANCHORED, NOT MORE, AND NOBODY SHOULD READ PAST THIS. --lr 2e-5 was never
# screened, and halving the batch halves the effective step, so it is further from anything
# justified than it was. Any separation this run shows between arms carries that caveat. It is
# held identical across arms, so it cannot become a confound BETWEEN them -- it only limits what
# an absolute number means.
#
# THE BASE CHECKPOINT PATH IS philote-dev's, FROM d77fa255, AND IS NOT TO BE "TIDIED".
# s3://edullm-olmo-370m-ckpts/... appears in this repo's own PRD and docs and does not exist; the
# weights are under edullm-checkpoints/olmo-370m/. Three of my runs died on the invented path.
# verify_checkpoint.py strict-loads it before any arm starts, so a wrong path or a missing grant
# costs a minute and the queue slot rather than the run.
#
# THREE PARTS ARE PINNED BY THE PLATFORM AND MUST NOT BE REQUOTED OR REORDERED:
#   EDULLM_LAUNCH_CHECK=waived   5 processes on 8 cards. THE SPACE BEFORE THE SEMICOLON IS
#                                LOAD-BEARING: carries_the_token matches an exact word after
#                                shlex splitting, so `waived;` is a different word and never
#                                matches. It is not silent -- the approver is told the run bills
#                                for 8 and starts 5.
#   "$EDULLM_CHECKPOINT_DIR/A$i" require_a_save_folder_a_retry_can_find reads the command TEXT
#                                for this variable. It expands to an s3:// URI, which
#                                train_codi.py handles by staging locally and mirroring each
#                                artifact as it is written.
#   --rung olmo3_370M            explicit, because train_codi.py still defaults to olmo2_370M,
#                                and a forgotten flag trains one architecture and evaluates as
#                                another.
#
# THE ARM LOGS GO TO /tmp AND ARE TAILED TO STDOUT -- philote-dev's cadda1c6. Redirecting to
# "$EDULLM_CHECKPOINT_DIR/A$i/train.log" writes to a LOCAL relative path ("s3:/bucket/...") that
# dies with the container, which is how two runs failed with no visible cause. /tmp plus a tail
# per arm puts every arm's progress in the run log, and the last 40 lines of each are dumped at
# the end so a failure is legible without a second dispatch.
#
# THE EVAL RUNS IN THE SAME JOB, deliberately. It needs one GPU for ~25 min against ~5 h of
# training, so a second submission and a second approval would cost more waiting than compute.
# It reads $EDULLM_CHECKPOINT_DIR -- the arms' own mirrored checkpoints -- and republishes
# report.json after every arm, so a run killed at the wall still has every arm it finished.
# `|| true` on the eval: if it fails, the checkpoints are already in S3 and can be evaluated by a
# cheap follow-up, so an eval bug must not mark five trained arms as a failed run.
#
# --max-new-tokens IS NOT PASSED, ON PURPOSE. eval_arms_from_s3.py derives it from the test data
# (longest teacher trace + 8) and prints it. The first version of this hardcoded 64, taken from a
# count of whitespace words rather than tokens, and silently truncated 226 of 960 examples.
#
# --attempts 1 at submit time: there is no --resume, so a second attempt restarts from the base
# checkpoint and bills a second full run for one result.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'EDULLM_LAUNCH_CHECK=waived ; set -uo pipefail;
  DATA=data/latentcot/graph-reachability-depth/conversations;
  BASE=s3://edullm-checkpoints/olmo-370m/olmo3-370m/run-10b-equal/step12716/;
  ARMS=(A0 A1 A2 A3 A4);
  python src/scripts/latentcot/gen_graph_data.py;
  python src/scripts/latentcot/preflight.py --train-data $DATA/train-00000.jsonl
  --test-data $DATA/heldout-00000.jsonl || exit 1;
  python src/scripts/latentcot/verify_checkpoint.py --model olmo3_370M
  --init-checkpoint "$BASE" || exit 1;
  LOGS=/tmp/armlogs; mkdir -p "$LOGS";
  pids=(); tails=(); for i in 0 1 2 3 4; do : > "$LOGS/A$i.log";
  CUDA_VISIBLE_DEVICES=$i python src/scripts/latentcot/train_codi.py
  --arm ${ARMS[$i]} --rung olmo3_370M --init-checkpoint "$BASE"
  --steps 2000 --batch-size 8 --precision bf16 --lr 2e-5
  --init-seed 0 --seed 1 --log-every 50
  --wandb-project latent-cot-superposition
  --train-data $DATA/train-00000.jsonl --test-data $DATA/heldout-00000.jsonl
  --out "$EDULLM_CHECKPOINT_DIR/A$i"
  > "$LOGS/A$i.log" 2>&1 & pids+=($!);
  ( tail -n +1 -f "$LOGS/A$i.log" | sed -u "s|^|[A$i] |" ) & tails+=($!); done;
  rc=0; for p in "${pids[@]}"; do wait "$p" || rc=1; done;
  sleep 5; kill "${tails[@]}" 2>/dev/null || true;
  for i in 0 1 2 3 4; do echo "===== A$i last 40 ====="; tail -n 40 "$LOGS/A$i.log"; done;
  echo "===== EVAL =====";
  python src/scripts/latentcot/eval_arms_from_s3.py
  --checkpoint-root "$EDULLM_CHECKPOINT_DIR"
  --test-data $DATA/heldout-00000.jsonl
  --model olmo3_370M --precision bf16 --num-continuous-thoughts 10 --seed 1
  --out runs/latentcot/eval --publish-to "$EDULLM_CHECKPOINT_DIR" || true;
  exit $rc'
