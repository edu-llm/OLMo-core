# Run spec for the latent-CoT superposition pilot (PRD: docs/latent-cot/).
#
# 1 seed x 5 arms (A0 explicit-CoT baseline, A1 no-CoT floor, A2 CODI, A3 CODI+R1, A4 CODI+L2),
# 5,000 steps each, all five fine-tuning the SAME pretrained 370M base -- that shared start is
# the experiment's central confound control. See docs/latent-cot/phase8-runbook.md for the
# procedure and docs/latent-cot/handoff.md for the compute request.
#
# THREE PARTS ARE PINNED BY THE PLATFORM AND MUST NOT BE REQUOTED OR REORDERED:
#   EDULLM_LAUNCH_CHECK=waived   5 processes on 8 cards; launchers.LAUNCH_CHECK_WAIVER matches
#                                this literally. It is not silent -- waived_launch_check_note
#                                tells the approving lead the run bills for 8 and starts 5.
#                                THE SPACE BEFORE THE SEMICOLON IS LOAD-BEARING.
#                                carries_the_token matches an EXACT WORD after shlex splitting,
#                                so `EDULLM_LAUNCH_CHECK=waived;` splits as one word carrying
#                                the semicolon and never matches -- `edullm check` refused with
#                                `process_per_device` until the space was added. Moving it out
#                                to an `env` prefix also matches, but then argv[0] is `env`
#                                rather than a shell, the platform stops recursing into the
#                                script, and `checkpoint_path_not_in_command` refuses instead.
#                                Both guards are satisfied only by keeping `bash -lc` AND
#                                spacing the token off the semicolon.
#   "$EDULLM_CHECKPOINT_DIR/A$i" require_a_save_folder_a_retry_can_find reads the command TEXT
#                                for this variable. It expands to an s3:// URI, which
#                                train_codi.py handles by staging locally and mirroring each
#                                artifact as it is written (Path() would mangle it to 's3:/...'
#                                and silently lose everything).
#   --rung olmo3_370M            explicit, because train_codi.py still defaults to olmo2_370M,
#                                and a forgotten flag trains one architecture and evaluates
#                                as another.
#
# The output flag is --out, not --save-dir; train_codi.py has no --save-dir.
#
# THE THREE GATES BEFORE THE ARMS ARE NOT CEREMONY. data/ is gitignored, so a fresh clone has
# no dataset and the arms would train on nothing -- gen_graph_data.py builds it (~1 min, CPU).
# preflight.py is the pre-registration gate the PRD requires before any training. And
# verify_checkpoint.py strict-loads the shared base and drives one K-step continuous-thought
# forward+backward on the real 370M: that path -- input_embeddings= plus
# return_hidden_states=True plus per-block hooks, under flash-2 and sliding-window attention --
# has only ever run on tiny llama_like models in the CPU tests. It is also where a bad base
# path or a missing S3 grant surfaces once, clearly, instead of as five parallel tracebacks.
# A failure here costs a minute and the queue slot rather than the run.
#
# --attempts 1 at submit time: there is no --resume, so a second attempt would restart from the
# base checkpoint and bill a second full run for one result.
#
# 2,000 STEPS RATHER THAN 5,000, AND THE REASON IS THE CAP RATHER THAN THE SCIENCE. metrics.json
# is written last, after the final eval, so a run killed at the 24 h wall leaves checkpoints and
# NO reported number -- a day spent for nothing. Runtime is still unmeasured: ~13 h at an assumed
# 5% MFU, ~33 h at 2%, and only the second of those busts the cap. 2,000 steps lands near 5 h at
# 5% and still under the cap at 2%, so it finishes under any plausible throughput. At batch 16
# that is ~32k examples over a 2,400-example train set (~13 epochs), which is ample to separate
# the arms if they separate at all. --save-every 500 is kept deliberately: if this is killed
# anyway, best.pt and stepN.pt are already mirrored to S3 and eval.py can be pointed at them.
# W&B, AND WHY THE PROJECT IS NAMED HERE AS WELL AS AT SUBMIT TIME.
#
# Each arm streams its metrics to W&B through olmo_core.latentcot.tracking. Two independent
# things have to be true for that to happen, and only one of them is in this file:
#
#   1. A PROJECT IS NAMED. `--wandb-project` below does that unconditionally. The platform also
#      exports EDULLM_WANDB_PROJECT when `edullm submit --wandb-project ...` is passed, and
#      either source is enough -- but the flag is written here so tracking does not depend on
#      anybody remembering a submit-time argument on the run that matters.
#   2. WANDB_API_KEY IS IN THE CONTAINER. This file cannot supply it and must not try; a key
#      committed here would be a secret in an image built from the commit. It arrives with the
#      submission, which is why `edullm submit --wandb-project latent-cot-superposition` is
#      still the right way to launch this even with the flag set below.
#
# Grouping is deliberately not set: the platform exports WANDB_RUN_GROUP and the wandb client
# reads it by itself, so the five arms land in one comparable group named after the experiment.
# Run names are "<arm>-seed<n>", so A0..A4 are told apart inside it.
#
# If neither source names a project, or the key is missing, every arm trains UNTRACKED rather
# than dying -- a metrics sidecar must never cost a day of A100 time. It prints one line saying
# so, and `metrics.json` records whether tracking was active, because the line below sends each
# arm's stdout to a file (see the note on train.log under `command`).
#
# NOTE ON train.log: `> "$EDULLM_CHECKPOINT_DIR/A$i/train.log"` is a shell redirect, and
# $EDULLM_CHECKPOINT_DIR is an s3:// URI, so the shell writes to a LOCAL relative path
# ("s3:/bucket/...") that dies with the container -- the same Path()-mangling trap documented
# above, one layer out where no Python guard can see it. So these per-arm logs are NOT durable,
# and W&B plus the mirrored metrics.json are the only surviving per-step record. That is the
# main reason tracking is not optional here.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'EDULLM_LAUNCH_CHECK=waived ; set -uo pipefail;
  DATA=data/latentcot/graph-reachability-depth/conversations;
  BASE=s3://edullm-olmo-370m-ckpts/olmo3-370m/run-10b-equal/step12716/;
  ARMS=(A0 A1 A2 A3 A4);
  python src/scripts/latentcot/gen_graph_data.py;
  python src/scripts/latentcot/preflight.py --train-data $DATA/train-00000.jsonl
  --test-data $DATA/heldout-00000.jsonl || exit 1;
  python src/scripts/latentcot/verify_checkpoint.py --model olmo3_370M
  --init-checkpoint "$BASE" || exit 1;
  pids=(); for i in 0 1 2 3 4; do mkdir -p "$EDULLM_CHECKPOINT_DIR/A$i";
  CUDA_VISIBLE_DEVICES=$i python src/scripts/latentcot/train_codi.py
  --arm ${ARMS[$i]} --rung olmo3_370M --init-checkpoint "$BASE"
  --steps 2000 --batch-size 16 --precision bf16 --lr 2e-5
  --init-seed 0 --seed 1 --log-every 50
  --wandb-project latent-cot-superposition
  --train-data $DATA/train-00000.jsonl --test-data $DATA/heldout-00000.jsonl
  --out "$EDULLM_CHECKPOINT_DIR/A$i"
  > "$EDULLM_CHECKPOINT_DIR/A$i/train.log" 2>&1 & pids+=($!); done;
  rc=0; for p in "${pids[@]}"; do wait "$p" || rc=1; done; exit $rc'
