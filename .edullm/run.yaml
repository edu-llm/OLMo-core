# Three-arm HPO controller: eight parallel single-GPU trial workers.
#
# Set EDULLM_HPO_SPEC at submit time to one of:
#   .edullm/hpo-full-acronym-soup.json
#   .edullm/hpo-no-centaur.json
#   .edullm/hpo-no-proxy.json
#
# Run the proxy cohort first when starting Arms 1–2; see run-hpo-proxy-cohort.yaml.
# Expected wall time is about 1–1.5 hours on 8×A100; pass --hours 4 at check/submit as
# the hard runtime bound (the workload ceiling is 24h, but this study should not need it).
# Pass --attempts 2, the maximum olmo-core-train allows (OLMo-core resumes from checkpoints).
# The dtype token is explicit so the platform's precision guard can price it at check time.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'export PYTHONDONTWRITEBYTECODE=1 EDULLM_LAUNCH_CHECK=waived &&
  python .edullm/hpo_on_corpus.py "$EDULLM_RUN_ID"
  --controller-spec "${EDULLM_HPO_SPEC:?set EDULLM_HPO_SPEC to the controller JSON}"
  --checkpoint-root "$EDULLM_CHECKPOINT_DIR"
  --param-dtype bfloat16'
