# Run spec. Path is fixed: <repo-root>/.edullm/run.yaml
#
# Deliberately NOT here (extra="forbid" rejects unknown keys by name): team,
# experiment, dataset, compute_profile. Those are submit-time flags, because one
# commit run by two people belongs to two teams.
#
# PRIMARY shape is gpu-8xa100: 8 A100s, one independent arm per GPU, so 8 cells of
# the matrix finish in the wall-clock time of one. There is no single-GPU A100
# shape, which is why the entrypoint spawns its own processes.
#
# EDULLM_LAUNCH_CHECK=waived is required and precedent-backed: GPUs > 1 with no
# recognised launcher is otherwise refused as `process_per_device`, and the guard
# reads command text so it cannot see the processes .edullm/train.py starts.
#
# MEMSPLIT_CELLS selects the arms; --compute at submit time selects the shape. On a
# single-GPU shape drop the waiver and set MEMSPLIT_CONDITION/MEMSPLIT_SEED instead.
schema_version: 1
workload_profile: memsplit-hop-train
suggested_compute: gpu-8xa100

command: >-
  bash -lc 'EDULLM_LAUNCH_CHECK=waived python .edullm/train.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --data-root s3://sbsandbox-intern-edullm-outputs/teams/memory-split/datasets/memsplit-hop-v1/'
