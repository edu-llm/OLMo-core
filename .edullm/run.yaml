# Checkpoint-transfer smoke (Ben / Lin et al.): post-train an earlier base, apply
# Δ onto a later base from the same trajectory, report retention.
#
# Default mode is synthetic_twin (builds Ms→Mt by sequential train on one 370M-class
# model). Team S3 ladder dumps (step15000/20000) are the intended production pair;
# switch to --mode team_s3 once those old-OLMo model.pt keys load cleanly.
#
# Platform: push only on edullm/** (never main). Price with edullm check before submit.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-1xl4
command: >-
  bash -lc 'python .edullm/ckpt_transfer_smoke.py
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --mode synthetic_twin
  --steps-pre 60 --steps-gap 60 --steps-sft 40
  --seq-len 256 --batch-size 4
  --param-dtype float32'
