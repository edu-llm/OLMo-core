# The base run of the 2026-08-08 capacity block: 8 x p5.48xlarge, 64 H100, us-east-2a.
#
# WHAT READS THIS FILE. `infra/block-node-bootstrap.sh` in edu-llm/platform clones this branch
# onto every node, loads this file with `yaml.safe_load` and takes `command`. Nothing else in
# it is read, so the comments are for people and the one key is for the machine.
#
# WHAT THIS COMMAND MUST NOT CONTAIN, WHICH IS AS LOAD-BEARING AS WHAT IT DOES.
#
#   * No launcher. `edullm_platform.block_multinode.torchrun_command` prepends the rendezvous
#     form -- `--nnodes`, `--nproc-per-node`, `--rdzv-backend=c10d` and the endpoint -- and the
#     same string goes to all eight machines. A `torchrun` written here would be wrapped in a
#     second one and the first evidence is 64 workers fighting over 8 cards.
#
#   * No `--moe-shard-degree` and no `--moe-num-replicas`. `with_mesh_flags` appends the pair
#     it computed from the node count and the dispatch's `expert_parallel` input, and it
#     REFUSES a command that names either flag with a value disagreeing with that mesh. Naming
#     them here does not pin the mesh, it turns a dispatch into an error -- and the case it is
#     protecting against is the quiet one, where 32 on eight nodes is accepted, trains
#     correctly, and spends every MoE all-to-all on the network between machines.
#
#   * No `--save-folder`. The bootstrap sets `EDULLM_CHECKPOINT_DIR` to this run's own S3
#     prefix, and that derivation is what lets a second attempt resume the first instead of
#     repeating it at full price.
#
#   * NO ENVIRONMENT ASSIGNMENT IN FRONT OF IT, AND `PYTHONPATH=/work/src` IN PARTICULAR. The
#     problem it is reaching for is real: the image carries `olmo_core` on its own PYTHONPATH
#     and pip-installs it as well, so `import olmo_core` finds the commit the image was built
#     from and the `src/` this branch mounts at /work/src is never executed. The spelling does
#     not work. `torchrun_command` prepends the rendezvous form, so the first word of this
#     value becomes torchrun's positional `training_script` and torchrun execs
#     `python -u <that word> <the rest>` -- an assignment there is a filename Python cannot
#     open, on all 64 ranks. Read from torch/distributed/run.py `config_from_args`, which is
#     the function that builds that argv. The fix is in `train_on_corpus.py`, which puts its
#     own clone's `src/` on `sys.path` before importing anything; see its header. It needs no
#     word here, works the same under torchrun and under `edullm-node run`, and does not
#     hardcode /work.
#
# WHAT IT MUST CONTAIN THAT LOOKS LIKE IT COULD COME FROM THE ENVIRONMENT. The three dataset
# variables cannot. `main` refuses at exit 64 when `EDULLM_DATASET_ID`, `EDULLM_DATASET_VERSION`
# or `EDULLM_DATASET_TOKENIZER` is unset, and the block bootstrap sets none of the three -- it
# exports the run id, the output prefix, the checkpoint dir, the data bucket and the W&B
# variables and stops there. On the Batch path the submission form fills them; there is no form
# here, so they are arguments.

command: >-
  python .edullm/train_on_corpus.py
  --model-factory olmoe_7b_32x4
  --dataset-id pretrain/reservoir-dolma2
  --dataset-version v1
  --dataset-tokenizer tokenizer/dolma2-bpe
  --require-val
  --sequence-length 4096
  --global-batch-size 4194304
  --rank-microbatch-size 16384
  --steps 11921
  --warmup-steps 2000
  --learning-rate 4e-4
  --param-dtype bfloat16
  --save-interval 800
  --eval-interval 800
  --eval-batches 64
  --hf-export
  --hf-export-interval 2400
  --hf-tokenizer .edullm/tokenizer/dolma2
  --data-seed 0
  --fsdp-prefetch-factor 2

# ---------------------------------------------------------------------------------------
# THE THROUGHPUT FLAG THAT IS IN THIS COMMAND, THE ONE THAT IS NOT, AND WHY NEITHER IS A BARE
# DOTTED OVERRIDE.
#
# NOTHING BARE MAY BE APPENDED HERE, WHICH IS NOT WHAT THE ENTRY POINT'S OWN DOCSTRING IMPLIES.
# `main` merges leftover words into the config as dotted overrides, so appending
# `train_module.dp_config.prefetch_factor=2` looks like the cheap way to set it. It is not.
# `run_name` is a positional with `nargs="?"` and this command names no run -- the platform puts
# the id in `EDULLM_RUN_ID` -- so argparse binds the FIRST bare word to `run_name`. The setting
# does not apply, and the run is named `train_module.dp_config.prefetch_factor=2` in W&B and in
# the lineage record. `leftover == []` in the suite passed while this was true, because the word
# had been eaten rather than left over. `a_run_name_and_not_an_override` now refuses a positional
# containing `=`, so the same mistake exits 2 in the first second instead. An override is still
# fine after an explicit run id; it is only the first bare word that is dangerous.
#
# `--fsdp-prefetch-factor 2` IS HERE BECAUSE IT CANNOT MOVE A NUMBER. The library default is 0,
# and at 0 `Transformer.apply_fsdp` never calls `set_modules_to_forward_prefetch` at all, so every
# block's all-gather is issued when that block is entered rather than ahead of it. This is pure
# scheduling, so it is bit-identical to leaving it out and cannot break comparability with any run
# that did not carry it.
#
# EXPECT LITTLE, AND EXPECT NONE OF IT ON ONE NODE. The blocks it prefetches carry the non-expert
# parameters, which HSDP shards over `dp_shard` -- one node's eight cards, over NVLink. The 90% of
# this model that is expert parameters lives in a NESTED FSDP group that `prepare_experts_for_fsdp`
# shards over `dp_replicate`, the cross-node dimension and the expensive one, and naming a block in
# a prefetch list does not reach a group nested inside it. So this addresses the cheap collective
# and not the dear one. It is in the command because it is free, not because it is big. On a
# single-node probe `dp_replicate` is 1 and there is no cross-node traffic to overlap, so a probe
# cannot measure it either way.
#
# `--moe-router-bias-gamma 0.0001` IS NOT HERE, AND THAT IS A DECISION SOMEBODY HAS TO TAKE
# RATHER THAN A GAP. It turns on DeepSeek-V3's auxiliary-loss-free load balancing: a per-expert
# bias added to the router scores for top-k SELECTION ONLY, nudged towards whichever experts were
# under-used. The gating value multiplied into the expert output is still the unbiased score and
# no term is added to the loss. It is the single largest throughput lever anybody has found on
# this model -- measured load imbalance is 4.9-6.9 per block, and AI2's own OLMoE ablation
# measured perfectly balanced routing 20% ahead of learned token-choice routing on this exact
# architecture.
#
# It is left off because it changes the model. Routing differs from step one, so the control every
# arm is compared against would no longer be plain OLMoE, and every arm would have to carry the
# same flag or the comparison is confounded. That is the owner's call and not this file's. See
# `docs-frank/working/final-model/mfu.md` in the platform repository for the evidence, and for the
# twenty-minute experiment that would settle it before the money is spent.
#
# WHICHEVER WAY IT GOES, IT HAS TO GO THAT WAY BEFORE STEP ONE. The router registers a
# `score_bias` buffer only when gamma is set, so the flag changes the state dict: a checkpoint
# written without it does not resume into a run with it, or the other way round.
# `.edullm/verify_router_overrides.py` pins all of this, reaches no network and needs no GPU.
#
# ---------------------------------------------------------------------------------------
# WHERE EACH NUMBER CAME FROM. Every one is computed here or read from a file named here;
# none is quoted from a document.
#
# --sequence-length 4096, WHICH IS THE FLAG THIS RUN CANNOT LEAVE OFF. The parser's default is
# 2048 and its own help says why it stays there: every submission predating the MoE factory got
# that value, and moving a default makes a sweep spanning the change two experiments reported
# as one. `src/scripts/train/OLMoE-1B-7B.py` -- which d4b97fe aligned this entry point with --
# is at 4096.
#
# IT IS ALSO THE EXPORTED CONTEXT WINDOW, AND THERE IS NO SECOND FLAG FOR THAT. `get_hf_config`
# builds every config with `max_position_embeddings=-1`, because a `Transformer` carries no
# sequence length to read one off. What replaces it is `HFConverterCallback(max_sequence_length=...)`,
# which `train_on_corpus.py` fills from `--sequence-length` rather than exposing a separate
# `--max-sequence-length` -- that flag exists, but on the offline `convert_checkpoint_to_hf`
# script, not here, and a run declaring a context it was not trained at is not a thing anybody
# wants to be able to ask for. vLLM reads that field as the context window before it reads
# anything else, so the value is load-bearing rather than descriptive.
#
# THE FALLBACK IF IT WERE EVER NOT PASSED IS WORSE THAN -1 AND LOOKS FINE. `convert_checkpoint_to_hf`
# falls back to the tokenizer's `model_max_length`, and the tokenizer committed under
# `.edullm/tokenizer/dolma2` declares 8192. So an export that lost this wiring would not
# announce itself with a nonsense -1; it would serve a model claiming exactly twice the context
# it was trained at. `src/test/edullm_train_on_corpus_test.py` pins the wiring for that reason.
#
# --steps 11921 AND THE TOKEN BUDGET, WHICH HALVED ON 2026-08-08 FROM 100B TO 50B.
#   4,194,304 tokens/step  =  2^22, and 4,194,304 / 4,096 = 1,024 sequences a step
#   round(50,000,000,000 / 4,194,304)      = 11,921 steps
#   11,921 x 4,194,304                     = 50,000,297,984 tokens  (50.0003B)
#   overshoot against the 50B target       = 297,984 tokens, one part in 168,000
#
# WHY 50B IS A DEFENSIBLE PLACE TO STOP RATHER THAN A CONCESSION. 50B over 1.49B active
# parameters is 33.6 tokens per active parameter. At the same compute budget the
# Chinchilla-optimal DENSE point is 37.6B tokens on a 1.88B model, so this run is slightly
# over-trained relative to dense -- which is the correct direction for a sparse model, where the
# optimum sits at a higher token-per-parameter ratio than the dense law predicts. Against total
# parameters it is 7.0 tokens each, under-trained, which is also normal for an MoE and is the
# ratio a reader unfamiliar with sparse scaling will reach for first.
#
# --warmup-steps STAYS AT 2000 AND WAS NOT HALVED WITH THE BUDGET, WHICH LOOKS WRONG AND IS NOT.
# It was 8.4% of the run and is now 16.8%, and the instinct is to halve it to hold the shape.
# Summing the learning rate over every step of `CosWithWarmup` says the instinct is wrong:
# halving warmup to 1,000 changes the total delivered learning rate by 0.4 percentage points,
# because a shorter ramp is very nearly compensated by a longer cosine. Meanwhile warmup's job
# -- surviving the phase where the weights are random, the gradients are large and badly
# conditioned, and an MoE router can collapse onto a handful of experts -- takes an absolute
# number of steps to get through and does not scale with what happens afterwards. So halving it
# buys a rounding error and spends real risk on a run that cannot be repeated.
#
# --rank-microbatch-size 16384, IN TOKENS LIKE --global-batch-size AND NOT IN SEQUENCES.
#   1,024 sequences / 64 ranks   = 16 sequences a rank a step
#   16 x 4,096                   = 65,536 tokens a rank a step
#   65,536 / 16,384              = 4 micro-batches a rank a step, 4 sequences each
# The parser's default, kept because it divides. `OLMoE-1B-7B.py` uses two sequences a
# micro-batch (8,192 tokens), which also divides and gives eight; that is the number to drop to
# if the first hundred steps run out of memory, and it costs throughput rather than correctness.
#
# --steps IS THE LEARNING-RATE SCHEDULE AS WELL AS THE STOPPING POINT, WHICH IS WHY IT IS SIZED
# FOR THE WHOLE RUN AND NOT FOR WHAT ANY ONE ARM INTENDS TO SPEND. `TrainerConfig.max_duration`
# becomes `Trainer.max_steps` (`trainer.py:_get_max_steps`), and `Scheduler.set_lr` recomputes
# the rate every step from `global_step` against `max_steps` (`scheduler.py:73`). It is derived
# rather than stored, so it is not in a checkpoint and a resume with a different `--steps`
# silently continues on a different cosine. A truncated arm therefore keeps this number and
# stops with `trainer.hard_stop`, which `training_progress` reads separately and which does not
# reach the scheduler.
#
# --learning-rate 4e-4 and --warmup-steps 2000 are `src/scripts/train/OLMoE-1B-7B.py` lines 68
# and 85, which is the recipe this entry point was aligned with rather than a fresh guess. 2,000
# of 11,921 is 16.8% of the run in warmup; see the paragraph above for why that is left alone.
#
# --save-interval 800, AND THE INTERVAL IS THE PRODUCT HERE RATHER THAN INSURANCE. The
# downstream lane consumes intermediate checkpoints, so this is a delivery cadence.
#   800 steps is between 19 and 42 minutes across the plausible range of step times
#
# THE 2.265 s/step THAT USED TO BE DERIVED HERE WAS NEVER A MEASUREMENT. It was a 15-hour
# estimate divided by the step count, and it works out to 24.8% MFU against the 8.48 GFLOP/token
# figure -- a round guess wearing three decimal places. Restated against the 9.29 GFLOP/token
# OLMo-core actually logs, it is 27.2%. The interval is left at 800 because it lands in the right
# half-hour band across everything plausible: at 35% MFU a step is 1.76 s and 800 steps is 23
# minutes; at 22% it is 2.80 s and 37 minutes. Read the real figure off the first hundred steps
# and move this only if it falls outside that band.
#   23,842 / 800                              = 29 saves, at step 800 through 23,200
# THE 2.265 s/step IS AN ASSUMPTION AND THE ONLY ONE IN THIS FILE. It is the owner's 15-hour
# estimate divided by the step count, not a measurement. Read the real figure off the first
# hundred steps and re-dispatch with a corrected interval if it is far out; everything else here
# is arithmetic that does not move.
#
# --hf-export-interval 2400 RATHER THAN THE 2000 THAT WAS SUGGESTED, FOR ONE REASON: 2,000 is
# not a multiple of 800. The flag's own help asks for a multiple of `--save-interval` so that
# every export has a core checkpoint beside it, and without that the lane gets HuggingFace
# weights at steps no resumable checkpoint exists for.
#   2,400 = 3 x 800                = 10.07B tokens, 90.6 min apart
#   23,842 / 2,400                 = 9 exports in-run, plus one at the end from `post_train`
# WHOEVER READS THOSE NINE WHILE THE RUN IS STILL GOING MUST NOT TAKE THE HIGHEST STEP OFF A
# LISTING. `hf/step{N}` exists from the moment its first object lands and is whole minutes
# later, and the gap is where a poller spends most of its time. The rule for exports is
# `olmo_core.nn.hf.latest_complete_export` and for core checkpoints it is
# `Checkpointer.latest_checkpoint`; they are two functions because `dir_is_checkpoint` answers
# False for a complete export, so the checkpoint rule applied to `hf/` rejects everything.
# The cost is real and is why this is not simply the save interval: `_get_full_model_state_dict`
# gathers all 7,123,109,888 parameters to rank 0 with `cpu_offload=True` and every other rank
# waits at a barrier while rank 0 builds an HF model and writes it. At bfloat16 that is 13.27
# GiB gathered and written per export, ten times, and all 64 cards are idle for each of them.
# The wall-clock length of that stall is the one number here nobody has measured -- the smoke
# test in the report is what measures it, and 2,400 is the interval to revisit once it has.
#
# --hf-tokenizer .edullm/tokenizer/dolma2 AND WHY THE EMPTY DEFAULT IS DANGEROUS RATHER THAN
# MERELY SLOW. Left empty, the exporter falls through to `TokenizerConfig.dolma2().identifier`,
# which is the HuggingFace id `allenai/dolma2-tokenizer`, and calls
# `AutoTokenizer.from_pretrained` on it at export time. The fleet can reach huggingface.co --
# `block-launch-fleet.yml` refuses a subnet without `MapPublicIpOnLaunch`, and the nodes clone
# this branch from github.com over that same path -- so this is not about whether the fetch
# would work. It is about what one failed fetch costs: the call at `convert_checkpoint.py:185`
# is not guarded, it happens BEFORE the weights are written at line 200, and the callback runs
# with `raise_on_failure=False`. So an HF rate limit at the wrong minute discards the whole
# export, weights included, logs one line, and the run carries on. Committed here instead:
# 4.1 MiB of tokenizer.json, tokenizer_config.json and special_tokens_map.json, copied from
# s3://edullm-data-us-east-2/tokenizer/dolma2-bpe/v1/tokenizer/, which is the sealed publication
# of the same tokenizer. It loads to 100,278 entries with eos 100257, matching
# `TokenizerConfig.dolma2()` exactly. A relative path because the bootstrap mounts the clone at
# /work and runs with that as the working directory.
#
# --require-val, WHICH IS A REFUSAL THIS CORPUS PASSES AND THE OBVIOUS ALTERNATIVE DOES NOT.
# `s3://edullm-data-us-east-2/pretrain/reservoir-dolma2/v1/dataset.json` declares two partitions
# on its `tokens` group: `train-*.u32le.bin` at 250,242,924,544 rows and `val-*.u32le.bin` at
# 975,077,376. The 100B this run reads is 40% of the train partition, so it does not wrap.
# `regmix-10b` declares no val partition, and without this flag a run pointed at it would train
# for fifteen hours and report training loss under a name that reads like a result.
#
# --eval-interval 800, matched to the save interval so that every checkpoint the lane picks up
# has a held-out number beside it. It is close to free:
#   eval batch = rank_microbatch x world  = 16,384 x 64 = 1,048,576 tokens an eval step
#   64 eval steps                         = 67,108,864 tokens an evaluation, 6.9% of the split
#   forward-only, so roughly a third of a training step's cost per token:
#   67.1M / 3 / 4.19M                     = about 5.3 training steps' worth, per 800
# which is under 1% of the run.
