# smoke: Does the pipeline run at all, including the in-context endpoint that has never left a CPU?
#
# Seconds per cell. Worth it before the 11B-token sweep: <ctxmano> items are 256 tokens with a fresh
# operator table each and padding that tiles the instance, none of which had run on a GPU.
#
# Written by src/scripts/train/factcrowd/plan.py -- edit freely, but keep the dtype in the
# command text: the precision guard reads the words of the command and cannot see one set in code.
#
# Commit this to a branch named edullm/<something> and push. The platform builds the image from the
# last commit, so nothing uncommitted is part of the run. Then `edullm check --json`, then submit.
schema_version: 1
workload_profile: olmo-core-check
suggested_compute: gpu-4xa10g
fanout_size: 5
fanout_index_parameter: cell
command: >-
  bash -lc 'python src/scripts/train/factcrowd/train_cell.py "$EDULLM_RUN_ID" --config-dir
  src/scripts/train/factcrowd/configs/cells/smoke --cell-index "$AWS_BATCH_JOB_ARRAY_INDEX" --save-folder
  "${EDULLM_OUTPUT_PREFIX}ckpt" train_module.dp_config.param_dtype=bfloat16'
