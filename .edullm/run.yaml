# RE-EVALUATE ALL FIVE ARMS of run_019ff929 with the fixed explicit-CoT answer position.
#
# THIS IS THE RUN THAT PRODUCES THE NUMBERS TO PRESENT. run_019ff929 trained all five arms to
# step 2000 on the repaired data, but its image was built from 43f9d027 -- before the eval fix at
# dbe61102 -- so its own in-job gate A was computed as (A2 - a broken A0 of ~0.50) instead of
# (A2 - a true A0 of ~0.97). That inflates gate A by roughly 45 points and flips its sign. The
# same checkpoints, re-scored with the corrected answer position, give the real gates.
#
# --match-steps is on and every arm reached step 2000, so all five are compared at an identical
# optimization budget rather than at whatever step each happened to stop on.
#
# This does no training. It reads checkpoints another run already wrote, so it names
# olmo-core-check rather than the train profile -- no checkpoint contract, one attempt, and it does
# not need eight A100s for a forward pass. The five-arm training spec is in this branch's history at
# commit 43f9d027, and the run built from it, run_019ff929, is unaffected by anything here: the
# platform builds an image from a commit, so a later change to this file cannot disturb a job that
# is already running.
#
# THE BUG IS ALREADY CONFIRMED, so this run is not a diagnosis -- it is the measurement. On
# run_019ff806's A0 checkpoint the broken path scored 0.518 and the corrected path scored 0.968, with
# A1 unchanged at 0.504 as the control and the eval running in 9.5 min instead of 27.6 because
# generation now stops instead of hitting the cap on every example. run_019ff929's own in-job eval
# used the broken path, so its A0 term is ~0.50 rather than ~0.97 and its gate A is unusable.
#
# THE BUG. encode_example lays the teacher view out as
#     question <bot> cot <eot> <distill> answer
# with the label mask True on the cot span and True on the answer span, but FALSE on both <eot> and
# <distill>. Nothing ever trains this arm to emit <distill>. The eval nevertheless generated "until
# <distill>" and read the answer logits wherever generation stopped -- for a token the model was
# never supervised to produce, that means the cap on essentially every example. And the answer was
# supervised as P(answer | ... cot <eot> <distill>), so reading it without <distill> in place is
# off-distribution too. Either fault alone drives accuracy to chance however well the CoT was
# learned.
#
# THE FIX, in answer_logits: generate the CoT, stop on a token the model IS supervised to emit
# (render_cot ends with `found` or `none`, both inside the supervised span), then rebuild
# `... <eot> <distill>` and read the answer at that DISTILL position. The eval now constructs the
# position instead of hoping the model produces it.
#
# READ THE `generation` BLOCK IN THE REPORT, NOT JUST THE ACCURACY. Each arm's entry now carries
# explicit_cot_cap_hits / explicit_cot_examples / explicit_cot_generated, and that ratio is the
# whole diagnosis -- it is why this is worth a card:
#   - cap_hits near zero, accuracy still ~0.5  ->  the fix worked and A0 genuinely cannot solve the
#     task at this budget. The ceiling is at chance, gate A has no headroom, and that is a real if
#     unwelcome result about a 370M model rather than a bug.
#   - cap_hits high  ->  the arm still is not stopping where it should, the number is still not a
#     measurement of reasoning, and the next fix is the label mask, so <eot>/<distill> are
#     supervised at training time.
# Neither branch is guessable from accuracy alone, which is exactly why the counter exists. It
# should have been added when this was first flagged.
#
# ALL FIVE ARMS, because run_019ff929 is the first run in which all five wrote checkpoints -- 24
# files each, step100..2000 -- after gradient accumulation cut a CODI arm's peak from 38.72 GiB to
# 15.6 GiB. A1 doubles as the control on this change: its no_cot path is untouched by the eval fix,
# so it should still read ~0.504, and if it moves the fix did something it should not have.
#
# --max-new-tokens is left unset so eval_arms_from_s3.py derives it from the test data and prints
# what it chose. It was hardcoded to 64 once, from a count of whitespace words rather than tokens,
# and silently truncated 226 of 960 examples.
#
# The checkpoint root is run_019ff929's; $EDULLM_CHECKPOINT_DIR is this run's own output, so
# report.json lands under this run id rather than overwriting the earlier one.
schema_version: 1
workload_profile: olmo-core-check
suggested_compute: gpu-1xl40s
command: >-
  bash -lc 'set -uo pipefail;
  export PYTORCH_ALLOC_CONF=expandable_segments:True;
  DATA=data/latentcot/graph-reachability-depth/conversations;
  CKPTS=s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019ff929-36c1-70bb-bd3a-0753a46c0330/checkpoints;
  python src/scripts/latentcot/gen_graph_data.py;
  python src/scripts/latentcot/eval_arms_from_s3.py
  --checkpoint-root "$CKPTS" --arms A0,A1,A2,A3,A4 --match-steps
  --test-data $DATA/heldout-00000.jsonl
  --model olmo3_370M --precision bf16 --num-continuous-thoughts 10 --seed 1
  --out runs/latentcot/eval --publish-to "$EDULLM_CHECKPOINT_DIR"'
