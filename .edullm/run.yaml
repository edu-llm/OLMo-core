# Everything here is a property of the code and travels with it in git.
# What a run costs -- the machine, the corpus, the experiment -- is supplied at
# submit time, because one commit run by two people belongs to two teams.
#
# Workload profiles registered for OLMo-core: olmo-core-check, olmo-core-train.
# edullm check prices this and lists every refusal, without dispatching anything.
#
# olmo-core-check rather than olmo-core-train, because this measures the card and
# the shape rather than training anything, so it opens no corpus and needs none.
#
# NO SHELL, AND NO WORD HERE CONTAINS A SPACE. edullm submit splits this string into
# words, rejoins them with a plain space and lets the compile job split it a second
# time, so any quoting is lost between the two. `bash -lc 'python x.py "$VAR"'` checks
# clean and is refused at submit with "bash -lc reads exactly one word as the command".
# The program reads EDULLM_RUN_ID out of the environment instead.
schema_version: 1
workload_profile: olmo-core-check
suggested_compute: gpu-1xt4
command: python .edullm/time_attention.py
