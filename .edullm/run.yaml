schema_version: 1
workload_profile: olmo-core-check
suggested_compute: gpu-1xa10g
# ONE COMMAND PER REPOSITORY, SO THIS FILE IS EDITED PER SUBMISSION. It currently scores the
# finished factcrowd grid. To train instead, put the train_cell.py command here, commit, and push.
#
# `olmo-core-check` rather than `-train` because scoring writes a CSV and no checkpoint, so it
# carries no checkpoint contract. The dtype is named in the command even though scoring only reads
# weights: the platform's guard reads the command text, cannot see a precision set in code, and a
# card with no bfloat16 in hardware would otherwise be admitted and then die on the first kernel.
command: >-
  bash -lc 'B=s3://sbsandbox-intern-edullm-outputs/teams/memory-split/runs;
  python src/scripts/train/factcrowd/score_run.py --prefix
  $B/run_019fd3c0-8d2c-70ce-873e-4c2e333856b6/
  $B/run_019fd3bf-ece6-708d-9706-08967ddbd557/
  $B/run_019fdd84-9e11-707b-bcd3-adbadb4468ea/
  --out ${EDULLM_OUTPUT_PREFIX}m0.csv --work-dir /tmp/g
  --device cuda --dtype float32 --batch-size 512 --last-only
  --write-gate-report ${EDULLM_OUTPUT_PREFIX}gates-mano.json --gate-endpoint mano'

