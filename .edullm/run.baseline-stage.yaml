# STAGE 1 OF THE TRANCHE: five seeds of the baseline arm, and no treatment arm.
#
#   edullm submit --experiment hyper-connections-370m --dataset regmix-10b-v1 \
#     --team input-core --hours 19 --fanout-size 5 --fanout-index-parameter seed
#
# The pre-registration forbids submitting a treatment arm before the noise-floor table has
# numbers in it, and this is the run that fills it. Nothing here is a treatment: every cell is
# `--arm baseline`, and the fan-out index moves only the replicate.
#
# ---------------------------------------------------------------------------------------
# WHY FIVE SEEDS AND NOT THREE, AND WHY THAT IS A SAVING RATHER THAN A COST
# ---------------------------------------------------------------------------------------
#
# The tranche was planned as 3 arms x 3 seeds at the 10B horizon, on the reasoning that the
# horizon was worth paying for. Measured seed variance says the opposite, and the measurement
# is not ours to argue with: Ai2's DataDecide (arXiv 2504.11393) published 1,050 models at
# 25 recipes x 14 sizes x 3 seeds with intermediate checkpoints, which is a direct read of
# seed sigma against token count at sizes that bracket 370M. Regressed over the 3B-30B window
# with model-size fixed effects, sigma goes as D^-0.172, with a bootstrap CI of [0.088, 0.306].
#
# That single exponent decides the whole design. A run costs money in proportion to D, so a
# fixed budget buys n = C/D runs, and the standard error of an arm mean is
#
#   SE  =  sigma(D) / sqrt(n)  ~  D^-0.172 * sqrt(D/C)  ~  D^(+0.328)
#
# The exponent is POSITIVE, so at a fixed budget every dollar moved out of seeds and into
# horizon makes the experiment less sensitive, not more. This is not a close call and it does
# not depend on the point estimate: at the pessimistic end of the CI the exponent is still
# +0.194, and it would only reach zero if sigma fell as 1/sqrt(D), which the same data rejects
# at P ~ 0. Halving the horizon costs 14% in sigma and buys 2.1x the seeds.
#
# So the tranche stays at 6,000 steps and 4.72B tokens, and the money the 10B horizon would
# have cost buys replicates instead. Five seeds per arm at 4.72B is a smaller minimum
# detectable effect than three seeds at 10B would have been -- 0.018 nats against 0.022 --
# for less money. Balanced 5/5/5 rather than a baseline triple followed by five-seed
# treatments, because an unbalanced 3/6 contrast carries SE = sigma*sqrt(1/3+1/6), which is
# 22% worse on H1 than a balanced 5/5 and buys nothing.
#
# WHAT THIS STAGE HAS TO PRODUCE BEFORE STAGE 2 IS SUBMITTED. Two numbers, both of which the
# treatment arms depend on and neither of which can be estimated from a treatment arm without
# circularity:
#
#   1. sigma-hat, on held-out bits-per-byte, with df = 4 rather than the df = 2 a triple would
#      have given. The 95% interval on a variance estimate at df = 2 spans a factor of about
#      3.4 end to end, which is not a noise floor, it is a rumour of one.
#   2. The per-source variance weights. Per-source sigma spans an order of magnitude on
#      DataDecide -- web-type sources sit at 0.003-0.006 nats while code sits at 0.025-0.050 --
#      and this corpus is code-heavy (starcoder, algebraic-stack, open-web-math against arxiv,
#      dclm, pes2o, wiki). An unweighted mean over sources that differ 4-7x in variance is
#      inefficient by construction. Inverse-variance weights estimated HERE, from the baseline
#      only, and frozen before any treatment arm runs, are worth another 1.2-2.9x on sigma at
#      zero compute. Estimated after seeing a treatment arm they would be a researcher degree
#      of freedom, which is why they are estimated in this stage and committed before stage 2.
#
# ---------------------------------------------------------------------------------------
# THE FLAGS THAT ARE NOT HERE
# ---------------------------------------------------------------------------------------
#
# --z-loss-multiplier, --held-out-shards, --bytes-per-token, --weight-decay, --eval-interval
# and --monitor-interval are all absent deliberately: their defaults in
# train_hyper_connections.py are already the tranche's values (1e-5, HELD_OUT_SHARDS,
# DOLMA2_BYTES_PER_TOKEN, DEFAULT_WEIGHT_DECAY, 500, 50). Repeating a default in the command
# is a second place for it to drift from the arm table.
#
# --seed and --arm: --arm IS here and --seed is NOT, and that asymmetry is load-bearing. Under
# `--fanout-index-parameter seed` every cell is handed this one command, so an explicit --seed
# would run five cells on one replicate -- five identical curves, a measured noise floor of
# zero, and every later arm significant against it. resolve_seed refuses that combination
# rather than resolving it. --arm is required on this path precisely because the index means
# the seed and nothing else supplies the arm.
#
# --rank-microbatch-size is 16,384 and not the 12,288 the A100 probe used: 786,432 over 4 ranks
# is 196,608 per rank, so 16,384 is 12 microbatches, and this is the value already measured at
# 10.32 s/step on a 48 GB L40S. The 12,288 in the probe was sized for a 40 GB A100 card.
#
# --hours 19 covers a 17.8-hour cell -- 6,000 steps at 10.32 s/step is 17.2 hours, plus 12
# held-out evaluations at 104 s, 12 checkpoints at 46 s, 120 monitor firings at 1.37 s and
# 118 s of start-up, which is 0.58 hours -- with 6% spare. It is not 21 because the approved
# ceiling is attempts x hours x rate x cells and every unneeded hour is multiplied by twenty.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-4xl40s
command: >-
  bash -lc 'python -m torch.distributed.run --nproc-per-node=4 --standalone
  .edullm/train_hyper_connections.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --arm baseline
  --model-factory hc_370M
  --sequence-length 4096
  --global-batch-size 786432
  --rank-microbatch-size 16384
  --steps 6000
  --save-interval 500
  --warmup-steps 120
  --monitor-interval 50
  --eval-interval 500
  --param-dtype bfloat16'
