# Packaged OLMES evaluation base for OLMo2-370M curriculum checkpoints.
#
# Rewritten to match the actual trained model (audit finding 1e): the prior
# copy of this file was an OLMoE-1B-7B config (d_model=2048, mlp_ratio=8,
# vocab_size=100278) left over from the dropped OLMoE extension, silently
# driving tokenizer and evaluator construction for a 370M run. Values below
# are computed from `curriculum_model.py` / `TransformerConfig.olmo2_370M`:
# d_model=1024, hidden_size_multiplier=1.5, hidden_size_multiple_of=256 ->
# FFN hidden size = ensure_multiple_of(int(1.5 * int(8*1024/3)), 256) = 4096,
# so mlp_ratio = 4096 / 1024 = 4.
#
# CONFIRMED against the pinned ai2-olmo commit
# (090253dac6688f2532509daa7aa2eb5fae50e956, olmo/config.py): `mlp_ratio`
# is documented there as "The ratio of the inner MLP dimensionality to
# ``d_model``. This is only used when ``mlp_hidden_size`` is not set", and
# its default is 4. So 4 is correct on that reading.
#
# It is also inert here, which is the more useful fact: this file builds an
# ai2-olmo TrainConfig used only for tokenizer and downstream-evaluator
# construction. The model actually under test is built separately from
# `curriculum_model.build_model_config` (eval_task_loss_olmo_core.py:85), so
# no ai2-olmo model is ever instantiated and no width from this file reaches
# the measurement. What does matter here is max_sequence_length, the vocab
# and embedding sizes, the special token ids, and the tokenizer identifier.
run_name: curriculum-370m-ladder
seed: 42
model:
  d_model: 1024
  n_heads: 16
  n_layers: 16
  mlp_ratio: 4
  vocab_size: 100352
  embedding_size: 100352
  eos_token_id: 100257
  pad_token_id: 100277
  max_sequence_length: 2048  # was unset -> ai2-olmo default (1024), silently
                              # truncating 5-shot ICL context at half the
                              # model's trained sequence length (audit 1e)
tokenizer:
  identifier: allenai/dolma2-tokenizer
global_train_batch_size: 8
device_train_microbatch_size: 1
device_eval_batch_size: 4
evaluators: []
