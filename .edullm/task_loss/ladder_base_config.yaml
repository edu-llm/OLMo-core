# Packaged OLMES evaluation base for stock OLMoE-1B-7B curriculum checkpoints.
run_name: curriculum-olmoe-1b-7b-ladder
seed: 42
model:
  d_model: 2048
  n_heads: 16
  n_layers: 16
  mlp_ratio: 8
  vocab_size: 100278
  embedding_size: 100352
  eos_token_id: 100257
  pad_token_id: 100277
tokenizer:
  identifier: allenai/dolma2-tokenizer
global_train_batch_size: 8
device_train_microbatch_size: 1
device_eval_batch_size: 4
evaluators: []
