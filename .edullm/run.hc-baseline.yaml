# STAGE 1: five seeds of the baseline arm, and no treatment arm.
#
#   edullm check  --json --spec .edullm/run.hc-baseline.yaml \
#     --experiment hc-moe-stream-balance --dataset regmix-10b-v1 \
#     --team input-core --compute gpu-1xa10g --hours 12
#   edullm submit       --spec .edullm/run.hc-baseline.yaml \
#     --experiment hc-moe-stream-balance --dataset regmix-10b-v1 \
#     --team input-core --compute gpu-1xa10g --hours 12
#
# RUN .edullm/run.hc-smoke.yaml FIRST. It is the same command at forty steps for two dollars,
# and the number it prints is what --steps below should be set from. See "THE HORIZON".
#
# The pre-registration this belongs to -- `38b66591`, `.edullm/run.baseline-stage.yaml` on
# `edullm/hyper-connections-370m` -- forbids submitting a treatment arm before the noise-floor
# table has numbers in it, and this is the run that fills it. Nothing here is a treatment:
# every cell runs the identical command and the fan-out index moves the replicate and nothing
# else. There is no hyper-connection in this command and no stream balancing; `smallmoe` is
# the unmodified factory in src/olmo_core/nn/transformer/config.py.
#
# ---------------------------------------------------------------------------------------
# WHY FIVE SEEDS, AND WHY THAT IS THE CHEAP CHOICE RATHER THAN THE THOROUGH ONE
# ---------------------------------------------------------------------------------------
#
# Ai2's DataDecide (arXiv 2504.11393) published 1,050 models at 25 recipes x 14 sizes x 3
# seeds with intermediate checkpoints, which reads seed sigma against token count directly.
# Regressed over the 3B-30B window with model-size fixed effects, sigma goes as D^-0.172 with
# a bootstrap CI of [0.088, 0.306]. A run costs in proportion to D, so a fixed budget buys
# n = C/D runs and the standard error of an arm mean is
#
#   SE  =  sigma(D) / sqrt(n)  ~  D^-0.172 * sqrt(D/C)  ~  D^(+0.328)
#
# The exponent is POSITIVE across the whole confidence interval, so at a fixed budget every
# dollar moved out of replicates and into horizon makes the experiment less sensitive. That is
# the entire argument for the shape of this file: the horizon is short and the seeds are five.
#
# Five rather than three because a variance estimate on df = 2 has a 95% interval spanning a
# factor of 12.1 end to end, which is not a noise floor but a rumour of one. df = 4 takes that
# to about 5.6, and pooling with the treatment arms later takes it further. See
# docs/hc-ablation/EXPERIMENT-DESIGN.md for the resulting minimum detectable effect and for
# the honest statement of what it can and cannot detect.
#
# ---------------------------------------------------------------------------------------
# WHAT A CELL VARIES, AND WHY IT IS THREE SEEDS AND NOT ONE
# ---------------------------------------------------------------------------------------
#
# The platform's fan-out does NOT rewrite the command. `execution.fanout_cell_command` wraps it
# in a prologue that re-exports EDULLM_OUTPUT_PREFIX, EDULLM_CHECKPOINT_DIR and WANDB_RUN_ID
# per cell, and sets AWS_BATCH_JOB_ARRAY_INDEX and EDULLM_FANOUT_INDEX_PARAMETER in the
# environment. Deriving a seed from the index is the command's job, and a command that does not
# do it runs five identical replicates, measures a noise floor of exactly zero, and makes every
# later arm significant against it. That failure is silent in every log.
#
# So SEED is read from AWS_BATCH_JOB_ARRAY_INDEX and reaches three fields, because
# train_on_corpus.py carries three seeds and moving one of them is not a replicate:
#
#   --data-seed "$SEED"        NumpyDataLoaderConfig.seed -- the shuffle and the batch order.
#   model.init_seed="$SEED"    TransformerConfig.init_seed -- the parameter initialisation.
#                              Transformer.init_weights seeds its generator from this field
#                              specifically, NOT from the global seed, so leaving it out would
#                              give five runs one set of initial weights.
#   init_seed="$SEED"          ExperimentConfig.init_seed, which train() hands to seed_all()
#                              before anything is built -- dropout, and any ambient RNG.
#
# A replicate that moved only the data seed would measure the data-order component of seed
# variance and call it the noise floor. That is an underestimate by construction, and it is an
# underestimate of exactly the quantity the gate is built out of, so it fails toward claiming
# results that are not there.
#
# `${AWS_BATCH_JOB_ARRAY_INDEX:-0}` rather than the bare variable, so that the same command
# runs outside a fan-out -- which is how the smoke spec runs it, and how anybody debugging
# will.
#
# ---------------------------------------------------------------------------------------
# THE HORIZON, AND THE ONE NUMBER HERE THAT IS A GUESS
# ---------------------------------------------------------------------------------------
#
# --steps 3000 at 262,144 tokens a step is 786M tokens per cell. That number came from
# arithmetic, not from a measurement, and the arithmetic is worth stating so it can be
# corrected rather than trusted:
#
#   `smallmoe` activates about 190.7M parameters per token -- 12 layers x (2.36M attention +
#   3.54M shared MLP + 3.54M of 4-in-32 experts) plus the 77.07M output projection -- which is
#   about 1.37 GFLOP/token forward and backward including attention. An A10G is 125 TFLOP/s
#   bf16 dense; at an assumed 20% MFU that is 18.2k tokens/s, so 786M tokens is about 12.0
#   hours. An MoE whose experts are 32 GEMMs of hidden size 384 is precisely the shape where a
#   20% MFU assumption is worth least, and nothing in this repository has measured it.
#
# SO SET IT FROM THE SMOKE. Take `seconds / steps` out of the smoke run's summary JSON and set
#
#   --steps  =  floor( 0.85 * 12 * 3600 / step_seconds )
#
# rounded down to a multiple of --save-interval. Then commit that edit and push it, because
# the image is built from the commit.
#
# OVERSHOOTING IS RECOVERABLE AND UNDERSHOOTING IS SAFE, WHICH IS WHY 3000 IS LEFT IN RATHER
# THAN SOMETHING TIMID. `olmo-core-train` allows two attempts and checkpoints every 500 steps,
# so a cell that runs out of wall clock resumes and finishes on the second attempt -- that is
# what the second attempt is priced for. What is NOT recoverable is a tranche in which some
# cells reached 3000 steps and others did not, because the horizon is then confounded with the
# cell. If the smoke says the estimate was optimistic, lower --steps before submitting; do not
# submit and hope.
#
# ---------------------------------------------------------------------------------------
# WHAT THIS RUN CAN AND CANNOT MEASURE
# ---------------------------------------------------------------------------------------
#
# CAN: sigma-hat of the final training cross-entropy across five seeds, at df = 4, on the
# corpus and the shape the treatment arms will use. Wall-clock, tokens/second and peak memory
# per cell, from the summary JSON. Five checkpoints per cell, at 500-step intervals.
#
# CANNOT: anything held out, and this is the honest limit of using only code that already
# exists. train_on_corpus.py wires no evaluator, deliberately -- its header says so and says
# why -- and regmix-10b declares no validation split, so there is no `.val` for an evaluator to
# read and no per-source breakdown to weight. The per-source inverse-variance weights the
# pre-registration wants from this stage are therefore NOT produced here.
#
# The route to both, which costs no GPU time now: every cell saves checkpoints, so a separate
# scoring job over those checkpoints produces held-out and per-source numbers after the fact.
# Carving a held-out set out of regmix-10b's 41 shards is what `--held-out-shards` on
# `edullm/hyper-connections-370m`'s train_hyper_connections.py does, and porting that file is
# the smallest change that would make this stage produce the metric the gate is written
# against. It is named in docs/hc-ablation/AGENT-STATUS.md under DECISIONS NEEDED FROM HUMAN
# rather than done here, because a stage-1 baseline whose entrypoint nobody has run is not a
# stage-1 baseline.
#
# ---------------------------------------------------------------------------------------
# THE FLAGS THAT ARE NOT HERE, AND THE FIVE THINGS IN THE TEXT THAT ARE THERE FOR THE GUARDS
# ---------------------------------------------------------------------------------------
#
# --work-dir is absent because train_on_corpus's default (/tmp/dataset-cache) is right and
# repeating a default is a second place for it to drift.
#
# `train_module.compile_model=false` IS here and is not a default. train_on_corpus turns
# torch.compile ON, which is right for the dense models it was written for and is unproven
# against an MoE whose expert dispatch is data-dependent. Compiling is a throughput decision
# and this tranche is a variance measurement; turning it on later is one word, and finding out
# in hour one of five twelve-hour cells that it graph-breaks or silently changes numerics is
# not. It has to be identical across every arm either way, which is the actual requirement.
#
# The five things in the command text that exist for the platform's guards -- the space before
# every `;`, the dtype named in the text, the checkpoint variable in expandable quotes, the
# inline redirect and replay, and the exit status carried past the replay -- are each explained
# in the header of .edullm/run.hc-smoke.yaml. They are the same five and they are load-bearing
# in the same way.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-1xa10g
command: >-
  bash -lc 'SEED="${AWS_BATCH_JOB_ARRAY_INDEX:-0}" ;
  LOG=/tmp/edullm-train.log ;
  python -m torch.distributed.run --nproc-per-node=1 --standalone
  .edullm/train_on_corpus.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --model-factory smallmoe
  --sequence-length 2048
  --global-batch-size 262144
  --rank-microbatch-size 8192
  --steps 3000
  --warmup-steps 200
  --save-interval 500
  --learning-rate 6e-4
  --data-seed "$SEED"
  --param-dtype bfloat16
  init_seed="$SEED"
  model.init_seed="$SEED"
  train_module.compile_model=false
  > "$LOG" 2>&1 ;
  status=$? ;
  tail -n 40 "$LOG" ;
  exit "$status"'
fanout:
  size: 5
  index_parameter: seed
