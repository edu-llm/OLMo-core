# Frontload-cl shared post-PT SFT (one epoch) from the control arm final checkpoint.
# Same mix/hparams as .edullm/run-sft.yaml; only --checkpoint differs.
#
#   edullm check  --json --spec .edullm/run-sft-control.yaml --team pre-training \
#     --experiment frontload-cl --dataset none --compute gpu-8xa100
#   edullm submit --spec .edullm/run-sft-control.yaml --team pre-training \
#     --experiment frontload-cl --dataset none --compute gpu-8xa100
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'set -euo pipefail;
  export EDULLM_LAUNCH_CHECK=waived ;
  python .edullm/frontload_cl/train_sft.py "$EDULLM_RUN_ID"
  --tokenize-only
  --dataset-id sft/frontload-cl-chat-sft
  --save-folder "$EDULLM_CHECKPOINT_DIR";
  python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/frontload_cl/train_sft.py "$EDULLM_RUN_ID"
  --checkpoint s3://sbsandbox-intern-edullm-outputs/teams/pre-training/runs/run_019fddc9-3aaa-70a2-a674-da0d60e14bf5/checkpoints/
  --dataset-id sft/frontload-cl-chat-sft
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --param-dtype bfloat16'
