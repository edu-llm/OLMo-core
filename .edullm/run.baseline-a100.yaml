# STAGE 1 ON gpu-8xa100: five seeds of the baseline arm, and no treatment arm.
#
#   edullm check  --json --experiment hyper-connections-370m --dataset regmix-10b-v1 \
#     --team input-core --spec .edullm/run.baseline-a100.yaml --compute gpu-8xa100 \
#     --hours 4 --attempts 2 --fanout-size 5 --fanout-index-parameter seed
#
# THIS BASELINE HAS RUN ONCE ALREADY AND HAS TO RUN AGAIN. `run_019fe2f4-f528` completed all
# five cells from an earlier version of this file and is what `.edullm/noise-floor.json` was
# frozen from. It measured sigma-hat at 0.0211 nats, 2.1x what the design was priced against,
# and found that 99% of that variance was two of the five cells taking a post-warmup loss
# spike they never recovered from. The amendment those numbers forced is the --optimizer line
# below, and an arm trained with it cannot be compared to one trained without it. So the
# frozen artifact stays as the record of what was seen, and the comparator is re-measured.
# The whole argument is in hyper-connections.md under "The amendment of 2026-08-08".
#
# WHY THIS FILE EXISTS. `run.baseline-stage.yaml` is the L40S submission and is not edited
# after the fact, because five cells were admitted from it. This is the same stage on the
# shape the capacity stall of 2026-08-08 moved the tranche to; the argument is in
# hyper-connections.md under "The tranche moved to gpu-8xa100".
#
# THE TWO WORDS THAT DIFFER FROM THE L40S SPEC, AND NOTHING ELSE DOES.
#
#   --nproc-per-node          8 rather than 4. `require_a_process_for_every_device` refuses
#                             the L40S command on this shape outright: four processes on
#                             eight cards bills four idle GPUs.
#   --rank-microbatch-size    12,288 rather than 16,384, and it is the A100 probe's own
#                             value. 786,432 over 8 ranks is 98,304 a rank, which 12,288
#                             divides exactly into 8 microbatches, and 12,288 puts the run
#                             at ~28.9 GiB of a 40 GB card. 16,384 would be ~35.7 GiB, which
#                             is 90% of the card before fragmentation, and an OOM is not
#                             retried. The arithmetic is in commit 075f52aa7.
#
# EVERY OTHER RESOLVED OPTION IS THE L40S BASELINE'S, INCLUDING THE ONES IT LEFT TO DEFAULTS.
# The L40S spec omitted --learning-rate, --weight-decay, --z-loss-multiplier,
# --held-out-shards and --bytes-per-token and took the parser's values for them; its own
# header records what those resolved to at commit 38b665919, and `hyper_connection_arms.
# STAGE_PINNED` holds them as literals. They are written out here for the reason that header
# gives about a staged tranche: a spec that leans on a default is a spec that changes when the
# default does, and the four A100 stages have to be comparable to each other whatever lands in
# between them.
#
# --seed IS ABSENT AND --arm IS PRESENT, exactly as on the L40S path. Under
# `--fanout-index-parameter seed` every cell is handed this one command and the index is the
# replicate; an explicit --seed would run five cells on one replicate, report a noise floor of
# zero, and make every later arm significant against it. `resolve_seed` refuses the
# combination rather than resolving it.
#
# --hours 4 COVERS A 3.00-HOUR CELL, AND 7 WAS A CEILING ON A NEED NOBODY HAD MEASURED. The
# 7 that stood here was derived from the A100 probe's 2.91 s/step, which predicted 5.5 hours.
# The five cells of run_019fe2f4-f528 then ran 2.92 to 3.00 hours each, so the prediction was
# high by 1.8x and the bound on top of it was high by 2.3x. Four leaves 33% over the slowest
# cell observed, which is more margin than the L40S stages carried at --hours 19. This arm has
# since reported five of five under it, so the four is right and stays.
#
# FOUR IS THIS ARM'S NUMBER AND NOTHING ELSE'S. DO NOT CARRY IT ONTO AN ARM WITH LANES. The
# baseline computes no hyper-connection lanes and runs at 1.700 s/step; the lane arms run at
# 2.87 to 3.15 and need five to five and a half hours for the same 6,000 steps. This four was
# copied onto all three of them, and all fifteen of their cells died at the wall between
# 22:27Z and 03:41Z on 2026-08-09, at steps 4,640 to 4,995 of 6,000, with a timeout measured
# to forfeit its second attempt. They were resubmitted at six and seven hours. The bound is per
# arm and lives in `hyper_connection_arms.A100_STAGE_HOURS_BY_ARM`; there is deliberately no
# scalar `--hours` constant left in the tranche for anyone to copy again.
#
# THE THREE HOURS MATTER BECAUSE THE CEILING IS A PRODUCT. Approved cost is rate x hours x
# attempts x cells, so an unneeded hour is charged twice for each of twenty cells. Dropping
# 7 to 4 takes the four-arm ceiling from about $6,148 to about $3,513 without shortening any
# run: nothing here changes what a cell does, only what it is allowed to spend doing it.
#
# SKIPPING STEPS DOES NOT LENGTHEN A CELL. A declined update costs the optimizer step and not
# the forward-backward, and replayed over the five measured cells the rule declines 0.12% to
# 0.52% of steps. That is under a minute on a three-hour run.
#
# --optimizer skip_step_adamw IS THE AMENDMENT, AND IT IS IDENTICAL ON ALL FOUR ARMS. It has
# to be: hyper-connections are one of the candidate explanations for the instability, so an
# optimizer that differed between arms would confound the contrast far worse than the noise
# it removes. The two constants are the library's own defaults, unchanged, which is what
# keeps them from being numbers chosen after seeing which cells spiked -- every official
# OLMo-2 and OLMo-3 pre-training script builds SkipStepAdamWConfig and none overrides either.
# `.edullm/skip_step_calibration.py` replays the rule over stage 1's own histories: it catches
# both spike onsets on the gradient-norm channel, at step 1,374 (z = +10.7) and step 1,726
# (z = +26.0), and costs 7, 13 and 14 steps of 6,000 on the three cells that never spiked.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/train_hyper_connections.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --arm baseline
  --model-factory hc_370M
  --sequence-length 4096
  --global-batch-size 786432
  --rank-microbatch-size 12288
  --steps 6000
  --save-interval 500
  --warmup-steps 120
  --learning-rate 7.8e-4
  --weight-decay 0.033
  --z-loss-multiplier 1e-5
  --held-out-shards 2
  --bytes-per-token 4.57
  --monitor-interval 50
  --eval-interval 500
  --optimizer skip_step_adamw
  --skip-step-sigma-factor 6
  --skip-step-rolling-interval 128
  --param-dtype bfloat16'
