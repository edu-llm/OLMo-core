# Dense OLMo2-370M warmup-quadratic MTLD arm. Matches the already-run
# curriculum W&B contract: constant LR after 24-step warmup, post-hoc EMA
# logged at step 2385 after the regular 2384 evals.
# Pass --hours 8 and --attempts 1 at edullm check/submit.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'EDULLM_CHECKPOINT_CHECK=waived
  EDULLM_WANDB_PROJECT=curriculum WANDB_PROJECT=curriculum
  WANDB_RUN_GROUP=curriculum-370m
  EDULLM_DATASET_ID=pretrain/regmix-10b EDULLM_DATASET_VERSION=v1
  exec python -m torch.distributed.run --standalone --nproc-per-node=8 --
  /opt/olmo-core/.edullm/curriculum_entrypoint.py --train-worker
  --arm-index 9 --nproc 8 --fresh
  --run-dir /tmp/curriculum-warmup-quadratic10-mtld --wandb-mode online
  --task-loss-eval-script /opt/olmo-core/.edullm/task_loss/eval_task_loss_olmo_core.py
  --ladder-base-config /opt/olmo-core/.edullm/task_loss/ladder_base_config.yaml
  --task-loss-nproc 8'
