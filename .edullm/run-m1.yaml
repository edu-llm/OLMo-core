# ARM M1 -- the MoE. 8 experts x 2,112, top-2, in blocks 9-24.
#
# ONE SPEC PER ARM, SELECTED WITH --spec, RATHER THAN ONE FILE EDITED BETWEEN SUBMISSIONS.
# Its siblings are run-d1.yaml (the control) and run-g8.yaml (granularity). A nine-cell
# campaign hand-editing a single spec is nine chances to submit the wrong arm under the right
# label, and nothing downstream would catch it -- the run id would say `m1-seed2` while the
# container trained a dense model. With three committed files each cell is reproducible from
# git, and `git show <sha>:.edullm/run-m1.yaml` answers "what did that run actually do".
#
# Everything here is a property of the CODE and travels with it in git; the machine, the
# corpus, the team and the experiment are supplied at submit time, because one commit run by
# two people belongs to two teams.
#
#   edullm check --json --spec .edullm/run-m1.yaml --experiment m1-seed0 \
#     --dataset reservoir-dolma2-v1 --team scratch --compute gpu-8xa100 --hours 2 --attempts 1
#   edullm submit <same flags>
#
# ⚠️ ALWAYS PASS --hours AND --attempts. The workload's defaults are 24 h x 2 attempts, which on
# gpu-8xa100 ($21.9576/h) prices at $1,053.96 worst case -- over policy v6's
# automatic_below_cost_usd of $500, so the run parks waiting for a lead instead of starting.
# Measured 2026-08-06: 24h x 2 = $1,053.96 routine; 16h x 1 = $351.32 automatic;
# 2h x 1 = $43.92 automatic. The bound is what buys the automatic gate, and a 200M-token probe
# finishes in ~30 min anyway. Note `check`'s class is a BEST CASE -- it cannot see the day's
# spend against automatic_daily_ceiling_usd ($1,000), so the compile job may still route to a
# lead. Read the real gate from `edullm status --json`.
#
# THE COMMAND IS TWO INVOCATIONS CHAINED WITH &&, AND THAT IS A FIX RATHER THAN A STYLE.
# `--prepare-heldout-only` builds the held-out instance indices in ONE process, before torchrun
# exists. NumpyPaddedFSLDataset.prepare() opens a bare ProcessPoolExecutor() -- os.cpu_count(),
# which is 96 on a p4d.24xlarge -- on fs_local_rank 0 only, and then every rank meets a
# barrier(). Run inside the distributed program, that deadlocked two 8-GPU runs at a 900 s gloo
# timeout for ~$11 and zero measurements (run_019fca21, run_019fcdd1). Standalone there is no
# process group, so the barrier is a no-op and the pool has the box to itself.
#
# BOTH INVOCATIONS MUST SHARE --work-dir or the second finds nothing cached and re-enters the
# deadlock. /tmp/dataset-cache is per-container, so the two must be ONE submission -- they
# cannot be split across runs.
#
# `require_a_process_for_every_device` reads the FIRST launcher among the shell's simple
# commands, so the leading single-process python does not trip the 8-device check; torchrun's
# --nproc-per-node=8 is what it matches. No EDULLM_LAUNCH_CHECK=waived is needed.
#
# THIS ARM, at vocab 100,352: 1,065,534,464 total / 442,680,320 forward.
#
#   M1.forward - D1.total = 131,072
#
# exactly, which is the sixteen routers (16 x 1,024 x 8) and nothing else. The control executes
# the same feed-forward width per token -- 4,224 = 2 x 2,112 -- so the ONLY thing M1 has that
# D1 does not is the ability to choose. If M1 wins, choosing is what won. Re-verify that
# integer after any change to the factories; if it moves, the comparison is void and no amount
# of seeds fixes it.
#
# --steps 1525 x --global-batch-size 131072 = 199,884,800 tokens, the 200M probe length. For a
# campaign cell at 10B, raise --steps to 76,294 and the runtime bound with it (~9.9 h of
# compute at 36.9% MFU, so --hours 16 --attempts 1 = $351.32 and still automatic).
#
# --data-seed IS THE SEED, and it is the only thing that differs between cells of one arm.
# Pass --data-seed 0/1/2 for the three seeds. Every other number here is held fixed across
# arms and seeds; a per-cell change to any of them makes the rungs incomparable.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'python .edullm/train_on_corpus.py "$EDULLM_RUN_ID"
  --model-factory edullm_moe_m1 --sequence-length 2048 --steps 1525
  --work-dir /tmp/dataset-cache --prepare-heldout-only
  && python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/train_on_corpus.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --model-factory edullm_moe_m1 --sequence-length 2048 --steps 1525
  --global-batch-size 131072 --rank-microbatch-size 8192
  --save-interval 500 --data-seed 0 --work-dir /tmp/dataset-cache
  trainer.callbacks.checkpointer.max_checkpoints=null'
