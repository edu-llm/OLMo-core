# THE NINE-RUN TRANCHE AT 6,000 STEPS AND 4.72B TOKENS, ON gpu-4xl40s. Staged, not
# submitted.
#
# This is the reviewed L40S configuration from commit d63dbb592 -- the same shape, the same
# horizon, the same microbatch, the same intervals, the same 21 hours -- turned from three
# submissions of a three-cell fan-out into one submission of nine cells. Every argument
# value is that commit's; what changed is which of them are in the command and which come
# from the cell index. `git show d63dbb592:.edullm/run.yaml` is the original, and its
# several hundred lines of argument for the horizon, the microbatch and the hours are not
# reproduced here.
#
# It is the variant to run if the throughput probe on gpu-8xa100 -- run_019fe262-778d,
# commit 075f52aa7 -- comes in above `A100_STEP_SECONDS_FOR_FULL_HORIZON`, which is 5.76
# s/step. Read the probe's clean median: steps 2-49 and 51-99, dropping step 1 and the two
# the evaluator and the monitor fire on.
#
#   cp .edullm/run.l40s-tranche.yaml .edullm/run.yaml && git commit && git push
#   edullm submit --experiment hyper-connections-370m --dataset regmix-10b-v1 \
#     --team input-core --hours 21 --attempts 2 \
#     --fanout-size 9 --fanout-index-parameter arm-and-seed
#
# ---------------------------------------------------------------------------------------
# NINE RUNS ARE NINE CELLS OF ONE SUBMISSION
# ---------------------------------------------------------------------------------------
#
# There is no `--arm` in the command below and no `--seed`. Every cell of a Batch array is
# handed one command and the only thing that differs is `$AWS_BATCH_JOB_ARRAY_INDEX`;
# `resolve_cell` in train_hyper_connections.py reads it under the `arm-and-seed` label and
# comes back with a pair out of `hyper_connection_arms.TRANCHE_CELLS`, derived from the seed
# counts in the arm table rather than written down twice:
#
#   cell 0,1,2   baseline      seeds 0,1,2
#   cell 3,4,5   faithful      seeds 0,1,2
#   cell 6,7,8   output-only   seeds 0,1,2
#
# Either flag written into this file is refused at build time rather than honoured, and the
# test suite catches it on a laptop first. The failure it guards against produces no error
# and no visibly wrong curve: cells that collide report a noise floor of zero, and the
# analysis plan divides every contrast by it.
#
# The three-submission form d63dbb592 was written for still works -- `--fanout-index-
# parameter seed` with `--arm` in the command -- and is the fallback if the nine-cell array
# ever has to be split.
#
# ---------------------------------------------------------------------------------------
# WHAT THIS COSTS
# ---------------------------------------------------------------------------------------
#
# Two numbers, different in kind, and both to be read out of `edullm check --json` rather
# than out of this paragraph. These were what it reported on 2026-08-08.
#
#   THE CEILING, which is what admission prices and what an approver reads:
#   rate x nodes x hours x attempts x cells, in
#   edullm_platform/contracts/workload.py:compute_maximum_compute_cost_usd. At $10.4926 an
#   hour, one node, 21 hours, two attempts and nine cells that is $3,966.20, which is under
#   the $4,000 budget. At 24 hours it is $4,532.80 and is not, which is why the hours are 21.
#
#   THE BILL, which is wall clock. edullm_platform/run_costs.py sums each attempt's
#   ended_at - started_at and multiplies by the rate, so an hour of `--hours` a run does not
#   use costs nothing. At the measured 10.32 s/step nine arms are 160.7 node-hours, about
#   $1,686.
#
# THE SECOND ATTEMPT IS KEPT HERE AND DROPPED ON THE A100 VARIANT, and the reason is
# arithmetic rather than principle: attempts multiply the ceiling, and two of them still fit
# $4,000 at this rate and do not at the other. What the second attempt buys is the one thing
# `RETRY_ONLY_WHAT_A_RETRY_FIXES` reliably grants, `OnStatusReason "Host EC2*" RETRY`, and
# the resume then does what it is supposed to.
#
# 17.9 HOURS AGAINST A 21-HOUR BOUND is 15% of margin for step-time drift over eighteen
# hours. An attempt killed by the timeout is not reliably retried -- it reaches a retry only
# by recording no container exit code, and torchrun's elastic agent re-raises
# SignalException and exits non-zero on SIGTERM in a dead heat with the container stop
# timeout -- so the horizon is set to fit one attempt rather than to be rescued by a second.
#
# ---------------------------------------------------------------------------------------
# WHAT A RETRY LOSES, AND THE ONE THING THAT MAKES A SECOND ATTEMPT SAFE
# ---------------------------------------------------------------------------------------
#
# `--save-interval 500` is 1.43 hours at 10.32 s/step, so that is the most work a lost host
# throws away. 13 permanent checkpoints over the run, all kept -- the workload role cannot
# prune. Under a fan-out each cell has its own checkpoint prefix, because FANOUT_PROLOGUE
# re-exports EDULLM_CHECKPOINT_DIR as .../cell-$AWS_BATCH_JOB_ARRAY_INDEX/checkpoints/ and
# the array index is stable across attempts of the same child, so a retry resumes its own
# cell rather than a sibling's.
#
# `--steps 6000` IS SPELLED OUT AND HAS TO BE ON EVERY ATTEMPT. Trainer.state_dict writes
# `max_steps` (trainer.py:828) and load_state_dict never reads it back (trainer.py:836-881);
# it is a property recomputed from max_duration, which train_on_corpus.py:653 sets from
# --steps, and Scheduler.set_lr reads trainer.max_steps live on every step. A second attempt
# given a smaller number does not resume the cosine, it starts a new one from wherever the
# first stopped and collapses the remaining decay into that segment -- and the loss curve
# continues smoothly, so it looks like a run that finished. A Batch retry re-runs the
# identical container, so this is safe exactly as long as nobody edits this file between
# attempts. It matters more here than on the A100 variant, because this is the variant that
# asks for a second attempt.
#
# ---------------------------------------------------------------------------------------
# THE FLAGS THIS CARRIES THAT d63dbb592 DID NOT, AND WHY EACH ONE IS SPELLED OUT
# ---------------------------------------------------------------------------------------
#
# Every one of these is already the parser's default, and every one was already in force on
# that commit's runs. They are written into the command anyway, because a default is a
# number in a Python file that a later commit may move, and nine runs compared against each
# other have to have been compared at the same settings. What is in the command text is what
# the lineage record seals.
#
#   --weight-decay 0.033        DEFAULT_WEIGHT_DECAY.
#   --z-loss-multiplier 1e-5    The 370M configuration calls for it and train_on_corpus
#                               never set it until ec40cdecb. RMSNorm readouts are
#                               scale-invariant, so cross-entropy cannot see hidden-state
#                               scale at all.
#   --held-out-shards 2         Inert on regmix-10b, which declares seven validation shards
#                               of its own; this is the carve fallback for a corpus that
#                               declares none.
#   --bytes-per-token 4.57      Sets the absolute level of bits-per-byte only.
#   --eval-interval 500         14 held-out evaluations at about 104 s each.
#   --monitor-interval 50       120 lane-monitor firings at about 1.37 s each, and only on
#                               the six cells that have lanes.
#   --fail-closed-by-step 400   The one thing d63dbb592's comment asked for and its command
#                               could not carry: "PUT IT BACK FOR faithful AND output-only".
#                               A three-submission tranche would have needed two different
#                               commands to do that; a nine-cell one does not, because
#                               train_hyper_connections.train attaches the monitor only for
#                               an arm with lanes, so the three baseline cells parse this
#                               flag and never build a callback that reads it. 400 is after
#                               warmup and inside the first checkpoint interval, so an inert
#                               mechanism costs 70 minutes rather than 18 hours.
#
# TWO FLAGS ARE DELIBERATELY ABSENT AND NEITHER IS AN OVERSIGHT.
#
#   --partial-rotary-factor     Unset means untouched, which is ordinary RoPE. Setting it
#                               would put an unmeasured second change inside the contrast H1
#                               and H2a are about.
#   --seed                      See the fan-out section above. This one destroys the tranche
#                               silently.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-4xl40s
command: >-
  bash -lc 'python -m torch.distributed.run --nproc-per-node=4 --standalone
  .edullm/train_hyper_connections.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --model-factory hc_370M
  --sequence-length 4096
  --global-batch-size 786432
  --rank-microbatch-size 16384
  --steps 6000
  --save-interval 500
  --warmup-steps 120
  --monitor-interval 50
  --eval-interval 500
  --fail-closed-by-step 400
  --weight-decay 0.033
  --z-loss-multiplier 1e-5
  --held-out-shards 2
  --bytes-per-token 4.57
  --param-dtype bfloat16'
