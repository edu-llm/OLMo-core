# SWEEP POINT: muon_w at 0.02 / sqrt(2). Lower bracket of the MuonW arm.
#
# NOTE THE COINCIDENCE AND DO NOT ACT ON IT: this LR is numerically equal to the muon_h upper
# bracket in run-sweep-muonh-0.01414.yaml, and means something different there. See that file.
#
#   edullm check --json --spec .edullm/run-sweep-muonw-0.01414.yaml --experiment muonh-370m \
#     --dataset olmo-150b-dolma2-v1 --team scratch --compute gpu-8xa100 --hours 7 --attempts 1
#
# The grid, why it is only four new runs, and why the horizon is not shortened are all in
# `.edullm/muon-hyperball.md`, section "Tuning the learning rate". Read that before changing a
# number here. The three things that must NOT be edited per point:
#
#   1. --steps 7630 and --warmup-steps 380. The comparison is at a completed cosine decay, so a
#      sweep point trained for fewer steps cannot be compared to the ones already finished, and
#      a shorter horizon moves the LR optimum it is supposed to be locating.
#   2. --adamw-learning-rate 8.2e-4, HELD FIXED ACROSS EVERY POINT. Only the muon-group LR is
#      swept. Scaling both together would sweep two variables and locate neither.
#   3. Everything else -- corpus, seed, batch, microbatch, dtype, initializer -- is identical to
#      run-moe-muonw.yaml, because the already-finished run at 0.02 is a point ON this grid and
#      stops being one the moment any of those differ.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'export TRITON_F32_DEFAULT=ieee
  && python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/train_on_corpus.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --model-factory olmo2_370M_moe --init-method fan_in
  --optimizer muon_w --learning-rate 0.01414214 --adamw-learning-rate 8.2e-4
  --param-dtype bfloat16
  --sequence-length 2048 --steps 7630 --warmup-steps 380
  --global-batch-size 524288 --rank-microbatch-size 8192
  --save-interval 1000 --data-seed 0 --work-dir /tmp/dataset-cache
  trainer.callbacks.checkpointer.max_checkpoints=null'
