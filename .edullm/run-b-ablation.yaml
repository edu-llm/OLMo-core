# Mamba-3 b=2 vs b=3 at 370M on 10B Dolma tokens. Two cells, one fan-out.
#
# Unlike the eight-arm bakeoff next to it, this wave is not a bakeoff: it is a single-variable
# ablation. The two cells build the same published Mamba-3 SISO architecture and differ in
# `rotation_block_size` and nothing else, which the entrypoint proves by diffing the two configs
# leaf by leaf before either one gets a GPU. See MAMBA3_B2_VS_B3.md.
#
# Check first -- it reaches no network, costs a fraction of a second, and lists every refusal at
# once. Read `cost` and `approval_class` out of its output; do not take them from this file.
#
#   edullm check --json \
#     --experiment mamba3-370m-b-ablation \
#     --dataset olmo-150b-dolma2-v1 \
#     --team <team> \
#     --spec .edullm/run-b-ablation.yaml \
#     --fanout-size 2 --fanout-index-parameter AWS_BATCH_JOB_ARRAY_INDEX \
#     --attempts 1
#
# Submit by replacing `check --json` with `submit`. Read `cost` and `approval_class` out of that
# output; no price, runtime bound or approver belongs in this file, because a copy here is a copy
# nothing updates.
#
# `olmo-150b-dolma2-v1` is the release behind the `s3://edullm-datasets/olmo-150b-dolma2/` mixture
# this entrypoint's `--data-config` defaults to. It is a statement about what the run reads, and
# `none` would be the wrong one: this run does read a corpus, unlike a smoke or an evaluation.
#
# SIZING THE HOURS. `check` prices against the workload's runtime bound, and that bound is a
# ceiling rather than a dial: ask for more hours than it allows and it returns no price at all.
#
# The faithful `b=3` arm has been measured on this exact shape -- the August eight-arm wave's
# `mamba-b3` rerun ran at 30,442 tok/s/device on eight A100s at sequence 4096, with about 1.6 h of
# fixed overhead per cell for image pull, compile, checkpointing and the end-of-run evaluation.
# This arm computes 0.954x that cell's FLOPs per token, which puts 10B tokens near 12.5 h, and
# `--scale 190M` at 20 tokens per parameter near 3.7 h. Both are inside the bound; `b=2` replaces a
# non-commutative prefix product with a cumsum and can only be faster than `b=3`, so the slower arm
# is the one those numbers describe.
#
# Those are rescaled measurements, not measurements. Confirm with a throughput smoke before
# committing the wave, and note that the run history `check` prints alongside the price is for the
# ~600M-token bakeoff cells rather than for this one.
#
# The dtype is written into the command on purpose. The program sets bfloat16 in code, where the
# precision guard cannot see it, so a command that did not name it would be admitted onto a card
# with no bfloat16 in the hardware and die on the first kernel that needs the format -- after the
# machine has been billed. Named here, that is a free refusal at check time. The override is a
# no-op against the recipe's own default, which is the point: it states it.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'export TRITON_F32_DEFAULT=ieee PYTHONDONTWRITEBYTECODE=1 &&
  I=${AWS_BATCH_JOB_ARRAY_INDEX:-0} &&
  ARMS=(b2 b3) &&
  python -m torch.distributed.run --nproc-per-node=8 --standalone
  src/scripts/train/OLMo3/OLMo3-370M-mamba3-b-ablation.py train
  "$EDULLM_RUN_ID-${ARMS[$I]}"
  --scale 370M --arm "${ARMS[$I]}" --replicate 0
  --rank-microbatch-size 8192
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  train_module.dp_config.param_dtype=bfloat16'
