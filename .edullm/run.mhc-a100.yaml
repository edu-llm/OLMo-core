# STAGE 3 ON gpu-8xa100, ARM 9 OF 11: five seeds of mHC x4, and nothing else.
#
#   edullm check  --json --experiment hyper-connections-370m --dataset regmix-10b-v1 \
#     --team input-core --spec .edullm/run.mhc-a100.yaml --compute gpu-8xa100 \
#     --hours 4 --attempts 2 --fanout-size 5 --fanout-index-parameter seed
#
# --hours 4 AND --optimizer skip_step_adamw ARE THE AMENDMENT OF 2026-08-08, and both are
# identical on all four arms. `run.baseline-a100.yaml` carries the full argument for each:
# briefly, the measured cells ran 3.00 hours against a 7-hour bound, and two of the five
# baseline cells spiked in a way that supplied 99% of the endpoint variance. The optimizer
# line is the intervention and it is the same on every arm because an optimizer that differed
# between them would confound the contrast far worse than the noise it removes.
#
# The L40S spec this is derived from is `run.mhc-stage.yaml` and it is not edited:
# `run_019fe2c2-f498` was admitted from it. See `run.baseline-a100.yaml` for why the shape
# moved, which two words differ from the L40S command, and why nothing else may.
#
# THERE IS NO --fail-closed-by-step HERE AND ADDING IT WOULD ABORT ALL FIVE CELLS AT STEP 400.
# It is the one flag `run.mhc-stage.yaml` could not copy from the faithful spec, it took a
# measurement to find out, and the arm table names it in STAGE_CONTRAST_EXEMPT with the reason.
# The Sinkhorn-Knopp constraint holds the lanes closer together than the dispersion floor the
# guard tests for, so the guard reads a healthy mHC run as a dead one.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/train_hyper_connections.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --arm mhc
  --model-factory hc_370M
  --sequence-length 4096
  --global-batch-size 786432
  --rank-microbatch-size 12288
  --steps 6000
  --save-interval 500
  --warmup-steps 120
  --learning-rate 7.8e-4
  --weight-decay 0.033
  --z-loss-multiplier 1e-5
  --held-out-shards 2
  --bytes-per-token 4.57
  --monitor-interval 50
  --eval-interval 500
  --optimizer skip_step_adamw
  --skip-step-sigma-factor 6
  --skip-step-rolling-interval 128
  --param-dtype bfloat16'
