# STAGE 2 ON gpu-8xa100, ARM 3 OF 3: five seeds of output-side mixing only.
#
#   edullm check  --json --experiment hyper-connections-370m --dataset regmix-10b-v1 \
#     --team input-core --spec .edullm/run.output-only-a100.yaml --compute gpu-8xa100 \
#     --hours 7 --attempts 2 --fanout-size 5 --fanout-index-parameter seed
#
# --hours 7, AND THE LINE ABOVE SAID 4 UNTIL 2026-08-10 WHILE THE RUN IT DESCRIBES WENT OUT AT
# 7. Four hours is the baseline's bound. This arm computes hyper-connection lanes, runs at
# 2.867-2.961 s/step against the baseline's 1.700, and needs 4.98 hours for 6,000 steps. The
# first submission of this stage, `run_019fe7bc-53f3`, died complete at the four-hour wall
# along with the other two lane stages -- fifteen cells between them, and a timeout is measured
# to forfeit its second attempt on this workload. `run_019fe9f6-d060` is the resubmission, it
# went out at seven, and it reported five of five.
#
# COPYING A SUBMIT LINE OUT OF A HEADER IS HOW FIFTEEN CELLS DIED, so this one is now the text
# of what was actually submitted rather than of what was once planned, and
# `hyper_connection_arms.A100_STAGE_HOURS_BY_ARM` is the machine-readable copy that
# `test_train_hyper_connections.py` checks this line against. There is deliberately no single
# `--hours` constant left to copy: the bound is per arm, because the arms have different step
# times and pretending otherwise is what killed the stage.
#
# --optimizer skip_step_adamw IS THE AMENDMENT OF 2026-08-08 and is identical on all five arms.
# `run.baseline-a100.yaml` carries the full argument: two of the five baseline cells spiked in
# a way that supplied 99% of the endpoint variance. The optimizer line is the intervention and
# it is the same on every arm because an optimizer that differed between them would confound
# the contrast far worse than the noise it removes.
#
# The L40S spec this is derived from is `run.output-only-stage.yaml` and it is not edited:
# `run_019fe2c2-bc91` was admitted from it. See `run.baseline-a100.yaml` for why the shape
# moved, which two words differ from the L40S command, and why nothing else may.
schema_version: 1
workload_profile: olmo-core-train
suggested_compute: gpu-8xa100
command: >-
  bash -lc 'python -m torch.distributed.run --nproc-per-node=8 --standalone
  .edullm/train_hyper_connections.py "$EDULLM_RUN_ID"
  --save-folder "$EDULLM_CHECKPOINT_DIR"
  --arm output-only
  --model-factory hc_370M
  --sequence-length 4096
  --global-batch-size 786432
  --rank-microbatch-size 12288
  --steps 6000
  --save-interval 500
  --warmup-steps 120
  --learning-rate 7.8e-4
  --weight-decay 0.033
  --z-loss-multiplier 1e-5
  --held-out-shards 2
  --bytes-per-token 4.57
  --monitor-interval 50
  --eval-interval 500
  --fail-closed-by-step 400
  --optimizer skip_step_adamw
  --skip-step-sigma-factor 6
  --skip-step-rolling-interval 128
  --param-dtype bfloat16'
